<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<!--
  basic_storefront.html — R Auto Parts · single-file working storefront (basic build)
  ─────────────────────────────────────────────────────────────────────────────────
  LOOK   : terminal window from the landing page prop (rautoparts — storefront / vendor · LIVE)
  TRUTH  : configs.flat.txt + storefront.txt —
           CFG constants §29 · tokens §02/03 (amber #f39a24 · gn/rd/bl · fg hierarchy) ·
           sort modes §06 nav.sort.options (6) · sentinel 300px + lazy thumbs 200px §08 ·
           PayPal cart §10 modal.paypal ·
           webp pipeline 1200×800@.68 / 240×160@.55 §12 ed.imgpipeline ·
           live search fields + instant filter §21 beh.search · schema.item §29 ·
           single-file monolith §24 arch (no build, CDN allowlist: Font Awesome 6.5.1)
  DATA   : B64 working folder is the database when run locally (file:// + showDirectoryPicker) —
           per-item {id}_{title}.b64 packets (Pkt codec, payload v9) + latest.b64 manifest
           autosaved on every change (storefront.txt DB module · configs §12 db.*);
           folder handle remembered in IndexedDB 'storefront-b64' → session persists,
           B64 button relinks on click (one permission prompt, no re-pick);
           every vendor write is read-back verified + conflict-checked against disk;
           STATIC DEPLOY (§21 data.static.* — ported from storefront.txt Static module): on
           http(s) the catalog is fetched READ-ONLY from /src/ (cfg.SRC) — latest.b64 manifest
           first (metadata + biz block), then per-item {id}_{title}.b64 packets on demand for
           photos; writes stay local-only (File System API needs file://), so edit on the local
           machine with the B64 folder linked and upload the folder contents to /src/;
           without /src on the server (or offline) the build falls back to IndexedDB + seed
           (legacy localStorage catalogs are migrated automatically — listings + photos live in
           IndexedDB now, so the old "Storage full — try a smaller photo" quota error is gone);
           browse state (search · sort · cards loaded · scroll position) is remembered, so the
           browser back button and "back to {business}" land on the exact same view, empty
           searches included;
           business info (name · PayPal · phone/addr/hours · vendor password as salted hash)
           lives in the latest.b64 manifest — header title + back button follow it live;
           vendors type "out of stock" in the search bar to pull up OOS listings, plus a
           show/hide OOS toggle in the vendbar;
           refresh guard (configs §20 modal.refreshguard) asks for the vendor PIN before a
           reload while vendor mode + B64 link are active.
-->
<title>R Auto Parts — storefront</title>
<meta id="og-t" property="og:title" content="R Auto Parts — storefront">
<meta id="og-d" property="og:description" content="Auto parts store">
<meta property="og:type" content="website">
<meta name="robots" content="index,follow">
<script type="application/ld+json" id="ld-store">{"@context":"https://schema.org","@type":"Store","name":"R Auto Parts","description":"Auto parts store"}</script>
<script type="application/ld+json" id="ld-item"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
/* ── tokens — configs §02 dark + landing mockwin surfaces ── */
:root{
  --am:#f39a24;--am2:#ffad3d;--amd:#a76a1c;--dim:rgba(243,154,36,.10);--ab:rgba(243,154,36,.35);
  --gn:#5cb47e;--rd:#d96565;--bl:#7ba3d8;
  --t1:#ececed;--t2:#a4a4a8;--t3:#6f6f73;
  --bd:rgba(255,255,255,.06);--bd2:rgba(255,255,255,.12);
  --win:#131313;--bar:#1d1d1d;--card:#242424;--img:#2b2b2b;--inp:#2a2a2a;
  --buy:#2a2a2e;--buy-bd:rgba(243,154,36,.30);
  --mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:#101012;color:var(--t1);font:400 14px/1.5 var(--mono);-webkit-font-smoothing:antialiased;
  height:100vh;height:100dvh;display:flex;align-items:stretch;justify-content:stretch;padding:0;overflow:hidden;
  -webkit-tap-highlight-color:transparent}
::selection{background:rgba(243,154,36,.30);color:#fff}
button{font-family:var(--mono);-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:1px solid var(--ab);outline-offset:1px}
/* Ultra-Thin Minimal — configs §23 scrl.std.block, applied to every scrollable container */
*{scrollbar-width:thin;scrollbar-color:#4b5563 #000000}
*::-webkit-scrollbar{width:6px;height:6px}
*::-webkit-scrollbar-track{background:#000000}
*::-webkit-scrollbar-thumb{background:#4b5563;border-radius:3px}
*::-webkit-scrollbar-thumb:hover{background:#6b7280}

/* ── terminal window (landing .mockwin) ── */
.mockwin{width:100%;max-width:none;height:100%;flex:1 1 auto;background:var(--win);
  border:none;border-radius:0;overflow:hidden;display:flex;flex-direction:column}

/* ── title bar ── */
.mw-bar{display:flex;align-items:center;gap:7px;padding:11px 14px;background:var(--bar);border-bottom:1px solid var(--bd);flex-shrink:0}
.dot{width:9px;height:9px;border-radius:50%;flex:none}
.dot.r{background:#ff5f56}.dot.y{background:#ffbd2e}.dot.g{background:#27c93f}
.mw-title{margin-left:8px;background:none;border:none;padding:0;color:var(--t3);font:500 13px var(--mono);
  cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:.02em;transition:color .15s}
.mw-title:hover{color:var(--t2)}
#tt-vend{transition:color .2s}
body.vend #tt-vend{color:var(--am);font-weight:700}
.mw-live{margin-left:auto;display:inline-flex;align-items:center;gap:6px;font:700 11px var(--mono);
  letter-spacing:.1em;text-transform:uppercase;color:var(--gn);flex:none;padding:3px 10px;border-radius:99px;border:1px solid transparent;transition:color .2s,background .2s,border-color .2s}
.mw-live::before{content:'';width:6px;height:6px;border-radius:50%;background:var(--gn);animation:livePulse 1.6s ease-in-out infinite alternate}
.mw-live.off{color:var(--t3)}
.mw-live.off::before{background:var(--t3);animation:none}
/* mode badge: live (web) · vendor (File System API available) · vendor linked (B64 /src folder connected) */
.mw-live.vendor{color:#ff9f1a;border-color:rgba(255,159,26,.55);background:rgba(255,159,26,.12)}
.mw-live.vendor::before{background:#ff9f1a;animation:none}
.mw-live.linked{color:#1a1206;background:#ff9f1a;border-color:#ff9f1a}
.mw-live.linked::before{background:#1a1206;animation:none}
@keyframes livePulse{from{opacity:.45}to{opacity:1}}

/* ── window body + toolbar ── */
.mw-body{flex:1;display:flex;flex-direction:column;min-height:0;background:linear-gradient(180deg,#202020,#1a1a1a);padding:12px}
.mw-head{display:flex;gap:8px;align-items:center;margin-bottom:10px;flex-shrink:0}
.mw-logo,.mw-sq{width:42px;height:42px;flex:none;border-radius:9px;background:var(--inp);border:1px solid var(--bd2);
  display:flex;align-items:center;justify-content:center;font-size:16px;cursor:pointer;color:var(--t3);
  transition:color .15s,border-color .15s,background .15s;position:relative;padding:0}
.mw-logo{background:var(--dim);border-color:var(--ab);color:var(--am)}
.mw-logo:hover{color:var(--am2);border-color:var(--am)}
.mw-sq:hover{color:var(--t1);border-color:var(--ab);background:#303030}
.mw-sq.am{color:var(--am);border-color:var(--ab)}
.mw-sq.am:hover{background:var(--dim);color:var(--am2)}
.sqwrap{position:relative;flex:none}
.mw-search{flex:1;min-width:0;height:42px;border-radius:9px;background:var(--inp);border:1px solid var(--bd2);
  display:flex;align-items:center;position:relative;transition:border-color .15s,background .15s}
.mw-search:focus-within{border-color:var(--am);background:#242424}
.mw-search>i{position:absolute;left:13px;font-size:14px;color:var(--t3);pointer-events:none}
.mw-search input{flex:1;min-width:0;height:100%;background:transparent;border:none;outline:none;color:var(--t1);
  font:400 15px var(--mono);padding:0 34px 0 38px}
.mw-search input::placeholder{color:var(--t3)}
#si-x{position:absolute;right:5px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--t3);
  cursor:pointer;font-size:12px;padding:5px 7px;display:none;line-height:1}
#si-x.show{display:block}
#si-x:hover{color:var(--t1)}

/* ── sort menu (configs §06 nav.sort.options — 6 modes) ── */
.pop{display:none;position:absolute;top:calc(100% + 8px);right:0;min-width:196px;background:var(--card);
  border:1px solid var(--bd2);border-radius:10px;padding:5px;z-index:60;box-shadow:0 8px 24px rgba(0,0,0,.45)}
.pop.on{display:block}
.sp-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 13px;border-radius:7px;
  color:var(--t2);font:500 13.5px var(--mono);cursor:pointer;white-space:nowrap}
.sp-row:hover{background:var(--dim);color:var(--t1)}
.sp-row .fa-check{font-size:9px;color:var(--am);visibility:hidden}
.sp-row.on{color:var(--am);font-weight:700}
.sp-row.on .fa-check{visibility:visible}
.sp-hd{font:700 8.5px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--t3);padding:6px 11px 3px}

/* ── vendor action bar (configs §12 — stats bar removed per vendor request) ── */
#vendbar{display:none;gap:6px;margin-bottom:8px;flex-wrap:wrap;flex-shrink:0}
#vendbar.on{display:flex}
.vb{height:34px;padding:0 13px;background:var(--inp);border:1px solid var(--bd2);border-radius:8px;color:var(--t2);
  font:600 12.5px var(--mono);cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;gap:7px;
  transition:background .15s,color .15s,border-color .15s}
.vb:hover{color:var(--t1);background:#303030}
.vb:active{opacity:.7}
.vb.am{color:var(--am);border-color:var(--ab);background:var(--dim)}
.vb.am:hover{color:var(--am2)}
.vb.gn{color:var(--gn);border-color:rgba(92,180,126,.4)}
.vb.rd{color:var(--rd);border-color:rgba(217,101,101,.4)}
/* detail-context vendor buttons (Edit/Sold/End/Delete) render inside the vendbar */
#vbdet{display:contents}
/* the bar doubles as the detail back-bar — customers see only the back button */
body:not(.vend) .vend{display:none!important}

#rline{display:none;font:400 13px var(--mono);color:var(--t3);margin:0 2px 7px;flex-shrink:0}
#rline b{color:var(--am);font-weight:700}

/* ── browse grid (landing .mw-grid / configs §07 desk 5-col) ── */
.views{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden}
.view{display:none}
.view.on{display:block}
#grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;padding:2px 2px 12px}
.mw-card{background:var(--card);border:1px solid var(--bd);border-radius:10px;overflow:hidden;cursor:pointer;
  transition:transform .15s,border-color .15s}
.mw-card:hover{transform:translateY(-2px);border-color:var(--ab)}
.mw-card:active{transform:translateY(0)}
.mw-card.ended{opacity:.55;border-style:dashed}
.mw-cimg{aspect-ratio:1/1;display:flex;align-items:center;justify-content:center;font-size:30px;color:#5d5d5d;background:var(--img)}
.mw-cimg img{width:100%;height:100%;object-fit:contain;display:block}
.mw-cbody{padding:11px 12px 13px}
.mw-ct{font-size:14px;line-height:1.35;color:var(--t2);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;white-space:normal;overflow:hidden;margin-bottom:8px;min-height:2.7em}
.mw-cp{font-size:19px;font-weight:700;color:var(--am);letter-spacing:-.01em}
.mw-csku{font-size:12px;color:var(--t3);margin-top:4px;letter-spacing:.03em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.oos{color:var(--rd)}

/* infinite scroll (configs §08 state.*) */
#loadMoreTrigger{height:24px;display:none;grid-column:1/-1}
#loadingIndicator{display:none;text-align:center;padding:16px 12px;color:var(--t3);font-size:13px;grid-column:1/-1}
#loadingIndicator::before{content:'';display:inline-block;width:14px;height:14px;border:2px solid var(--bd2);
  border-top-color:var(--am);border-radius:50%;margin-right:8px;vertical-align:-2px;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#endOfList{display:none;text-align:center;padding:12px;color:var(--t3);font-size:12px;letter-spacing:.06em;
  text-transform:uppercase;grid-column:1/-1}
#endOfList::before,#endOfList::after{content:'—';color:var(--bd2);margin:0 8px}
.empty{grid-column:1/-1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:48px 16px;color:var(--t2)}
.empty .ei{font-size:44px;opacity:.5}
.empty .et{font-weight:700;font-size:17px}
.empty .es{font-size:13px;color:var(--t3)}

/* ── status bar — every number computed live ── */
.mw-foot{display:flex;gap:14px;flex-wrap:wrap;align-items:center;padding:12px 16px 13px;flex-shrink:0;
  font-size:12.5px;color:var(--t3);letter-spacing:.02em}
.mw-foot b{color:var(--am);font-weight:700}

/* ── detail view ── */
.dwrap{display:grid;gap:22px;align-items:start;padding-bottom:16px}
@media(min-width:900px){.dwrap{grid-template-columns:52% 1fr}}
.dinfo{min-width:0}
.dimg{aspect-ratio:3/2;background:var(--img);border:1px solid var(--bd);border-radius:10px;display:flex;
  align-items:center;justify-content:center;font-size:72px;color:#5d5d5d;overflow:hidden}
.dimg img{width:100%;height:100%;object-fit:contain;display:block}
.dtitle{font-size:26px;font-weight:700;line-height:1.3;margin-bottom:12px}
.dprice{font-size:32px;font-weight:700;color:var(--am);letter-spacing:-.01em}
.dsku{font-size:17px;font-weight:700;color:var(--am);margin:6px 0 14px;letter-spacing:.02em}
.dmeta{font-size:16px;color:var(--t2);line-height:1.9}
.dmeta b{color:var(--t1);font-weight:500}
.dline{font-size:14px;color:var(--t3);line-height:1.7;margin:14px 0 6px;border-top:1px solid var(--bd);padding-top:14px}
#dbuy{width:100%;height:52px;margin-top:16px;background:var(--buy);border:1px solid var(--buy-bd);border-radius:8px;
  color:var(--am);font:600 16px var(--mono);cursor:pointer;letter-spacing:.02em;transition:background .15s,border-color .15s,transform .1s}
#dbuy:hover:not(:disabled){background:#34343a;border-color:var(--am)}
#dbuy:active:not(:disabled){transform:scale(.98)}
#dbuy:disabled{opacity:.4;cursor:not-allowed}
.dend{background:rgba(217,101,101,.10);border:1px solid var(--rd);border-radius:8px;padding:8px 12px;margin-bottom:10px;
  font-size:15px;font-weight:700;letter-spacing:.08em;color:var(--rd);text-transform:uppercase;text-align:center}

/* ── modals (configs §10 modal system) ── */
.mmod{position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:100;display:none;align-items:center;justify-content:center;padding:16px}
.mmod.onm{display:flex}
.mbox{background:var(--bar);border:1px solid var(--bd2);border-radius:14px;width:100%;max-width:380px;padding:18px;max-height:calc(100dvh - 32px);overflow-y:auto}
.mbox.wide{max-width:580px}
.mbox h3{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--t2);margin-bottom:14px}
.mbox h3 b{color:var(--am)}
.mrow{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
.mbtn{height:34px;padding:0 14px;background:var(--inp);border:1px solid var(--bd2);border-radius:8px;color:var(--t2);
  font:600 11px var(--mono);cursor:pointer;transition:background .15s,color .15s}
.mbtn:hover{color:var(--t1);background:#303030}
.mbtn.pri{background:var(--dim);border-color:var(--ab);color:var(--am)}
.mbtn.pri:hover{color:var(--am2);border-color:var(--am)}
.fi{width:100%;background:var(--inp);border:1px solid var(--bd2);border-radius:8px;color:var(--t1);
  font:400 12px var(--mono);padding:8px 10px;outline:none;transition:border-color .15s;min-width:0}
.fi:focus{border-color:var(--am)}
textarea.fi{resize:vertical;min-height:56px}
select.fi{cursor:pointer;appearance:none}
.flab{display:block;font-size:9px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--t3);margin:10px 0 4px}
.flab .req{color:var(--rd)}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.chkrow{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:11px;color:var(--t2);cursor:pointer}
.chkrow input{accent-color:var(--am);width:14px;height:14px;cursor:pointer}
#vpin{letter-spacing:.25em;text-align:center;font-size:14px}
.imgprev{width:72px;height:48px;object-fit:contain;background:var(--img);border:1px solid var(--bd);border-radius:6px;display:none}
.imgprev.has{display:block}

/* basket */
.bkrow{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--bd)}
.bkrow:last-of-type{border-bottom:none}
.bkinfo{flex:1;min-width:0}
.bkt{font-size:11px;color:var(--t1);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bks{font-size:9px;color:var(--t3);letter-spacing:.03em}
.bkqty{display:flex;align-items:center;gap:4px;flex:none}
.bkqb{width:24px;height:24px;background:var(--inp);border:1px solid var(--bd2);border-radius:6px;color:var(--t2);
  font-size:12px;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0}
.bkqb:hover{color:var(--t1)}
.bkq{width:34px;height:24px;background:var(--inp);border:1px solid var(--bd2);border-radius:6px;color:var(--t1);
  font:400 11px var(--mono);text-align:center;outline:none}
.bkp{font-size:11px;font-weight:700;color:var(--am);width:62px;text-align:right;flex:none}
.bkrm{background:none;border:none;color:var(--rd);cursor:pointer;font-size:11px;padding:3px;flex:none}
.bkrm:hover{color:#e88}
.bktot{display:flex;justify-content:space-between;font-size:11px;color:var(--t2);padding:3px 0}
.bktot.t{border-top:1px solid var(--bd2);margin-top:6px;padding-top:8px;font-size:13px;font-weight:700;color:var(--t1)}
.bktot.t span:last-child{color:var(--am)}
.bkempty{padding:26px 0;text-align:center;color:var(--t3);font-size:11px}

/* toast (configs §20/anim.toast-storefront) */
#toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(14px);opacity:0;z-index:200;
  background:var(--card);border:1px solid var(--ab);color:var(--t1);font:500 11px var(--mono);
  padding:9px 14px;border-radius:9px;pointer-events:none;transition:opacity .2s,transform .2s;max-width:calc(100vw - 32px)}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

/* ── responsive (configs §05: mobile-first, 2-col grid <769px) ── */
@media(max-width:768px){
  body{padding:0;align-items:stretch}
  .mockwin{width:100%;height:100dvh;border-radius:0;border:none}
  #grid{grid-template-columns:1fr 1fr;gap:8px;padding:2px 2px 10px}
  .mw-ct{font-size:14px}
  .mw-cp{font-size:18px}
  .dtitle{font-size:22px}
  .dprice{font-size:28px}
  .mmod.sheetm{align-items:flex-end;padding:0}
  .mmod.sheetm .mbox{max-width:100%;border-radius:14px 14px 0 0;border-left:none;border-right:none;border-bottom:none}
  .f2{grid-template-columns:1fr}
}
@media(max-width:560px){
  .mw-foot{gap:10px}
}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
/* ═══ ported storefront UI (modals · pending · packages · pickup · receipt) ═══ */
.pill{height:28px;padding:0 10px;background:var(--bg3);border:1px solid var(--bd);border-radius:14px;color:var(--t2);font-size:11px;font-family:var(--mono);cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;gap:5px;transition:background .15s,color .15s,border-color .15s}
.pill:hover{background:var(--bg4);color:var(--t1)}
.pill.on{border-color:var(--ab);color:var(--am);background:var(--dim)}
#bkimgmod{position:fixed;inset:0;z-index:400;background:rgba(0,0,0,.82);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:16px}
#bkimgmod img{max-width:92vw;max-height:80vh;background:#fff;border-radius:6px;box-shadow:0 4px 28px rgba(0,0,0,.5)}
#mxmod{position:fixed;inset:0;z-index:99998;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;padding:16px}
.mx-box{background:var(--bg2);border:1px solid var(--bd2);border-radius:12px;padding:16px;width:100%;max-width:400px;color:var(--t1);font-family:var(--mono)}
.mx-t{font-size:14px;font-weight:700;margin-bottom:6px}
.mx-n{font-size:12px;color:var(--t2);margin-bottom:10px;line-height:1.5}
.mx-f{margin-bottom:9px}.mx-f label{display:block;font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--t3);margin-bottom:3px}
.mx-f select,.mx-f input,.mx-f textarea{width:100%;box-sizing:border-box;background:var(--bg3);border:1px solid var(--bd2);border-radius:6px;color:var(--t1);padding:7px 9px;font-size:13px;font-family:var(--mono)}
.mx-b{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.mx-b .pill{flex:1}
.stbadge{display:inline-block;font-size:9px;font-weight:700;letter-spacing:.04em;padding:1px 6px;border-radius:10px;border:1px solid var(--bd2);margin-left:4px}
.stbadge.pend{color:var(--am);border-color:var(--am)}.stbadge.oos{color:var(--rd);border-color:var(--rd)}
.pendrow{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:4px;font-size:10px;color:var(--am)}
.pendrow button{font-size:10px;padding:2px 8px;border-radius:12px;border:1px solid var(--bd2);background:var(--bg3);color:var(--t1);cursor:pointer}
.pendrow button.ok{border-color:var(--gn);color:var(--gn)}.pendrow button.no{border-color:var(--rd);color:var(--rd)}.pendrow button.x{padding:0 7px;font-size:13px;line-height:16px}
#pdmod{position:fixed;inset:0;z-index:99997;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;padding:16px}
.pd-box{max-width:640px;max-height:86vh;overflow:auto}
.pd-row{display:flex;align-items:center;gap:10px;padding:8px;border:1px solid var(--bd);border-radius:8px;margin-bottom:6px;cursor:pointer;background:var(--bg3)}
.pd-row:hover{border-color:var(--am)}.pd-row img,.pd-ph{width:56px;height:40px;object-fit:cover;border-radius:5px;background:var(--bg4);flex:none}
.pd-i{flex:1;min-width:0}.pd-t{font-size:12px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.pd-m{font-size:10px;color:var(--t3);margin-top:2px}
.pd-x{border:1px solid var(--rd);color:var(--rd);background:transparent;border-radius:50%;width:22px;height:22px;cursor:pointer;font-size:14px;line-height:1;padding:0}
/* package form */
#pkform{position:fixed;inset:0;z-index:99996;background:rgba(0,0,0,.65);display:flex;align-items:center;justify-content:center;padding:16px}
.pkf-box{background:var(--bg2);border:1px solid var(--bd2);border-radius:14px;padding:20px 24px;width:100%;max-width:860px;max-height:92vh;overflow:auto;color:var(--t1);font-family:var(--mono)}
.pkf-h{display:flex;justify-content:space-between;align-items:center;font-size:16px;font-weight:800;margin-bottom:12px}
.pkf-x{background:transparent;border:0;color:var(--t2);font-size:18px;cursor:pointer}
.pkf-row{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:10px}.pkf-row .pkf-f{flex:1;min-width:130px}
.pkf-f{margin-bottom:8px}.pkf-f label{display:block;font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--t3);margin-bottom:3px}
.pkf-ro{padding:7px 9px;background:var(--bg3);border:1px solid var(--bd);border-radius:6px;font-size:13px}
.pkf-f input{width:100%;box-sizing:border-box;background:var(--bg3);border:1px solid var(--bd2);border-radius:6px;color:var(--t1);padding:8px 9px;font-size:14px;font-family:var(--mono)}
.pkf-f input::placeholder{color:var(--t3);opacity:.55;font-style:italic}
.pkf-f input.pkf-req{border:2px solid var(--gn)}.pkf-f input.pkf-req:not(.ok){border-style:dashed}.pkf-f input.pkf-req.ok{background:rgba(60,180,90,.18);border-style:solid}
.pkf-hint{font-size:11px;color:var(--t3);margin:-2px 0 10px}
.pkf-b{display:flex;gap:8px;margin-top:12px}.pkf-b .pill{flex:1;height:38px}
.pkf-pend{border:1px solid var(--am);border-radius:8px;padding:8px;margin-bottom:12px;background:var(--dim)}
.pkf-pt{font-size:11px;font-weight:700;color:var(--am);margin-bottom:6px}
.pkf-po{display:flex;gap:8px;align-items:center;padding:6px 8px;border:1px solid var(--bd);border-radius:6px;margin-bottom:4px;cursor:pointer;font-size:12px;background:var(--bg2)}
.pkf-po:hover{border-color:var(--am)}.pkf-po.sel{border-color:var(--gn);background:rgba(60,180,90,.15)}
.pkf-pb{flex:1;color:var(--t3);font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.pkf-pd{color:var(--am);font-size:10px;white-space:nowrap}
/* packages panel */
#pumod{position:fixed;inset:0;z-index:99996;background:rgba(0,0,0,.65);display:flex;align-items:center;justify-content:center;padding:16px}
.pu-box{background:var(--bg2);border:1px solid var(--bd2);border-radius:14px;padding:20px 24px;width:100%;max-width:900px;max-height:92vh;overflow:auto;color:var(--t1);font-family:var(--mono)}
.pu-sec{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--t3);margin:12px 0 6px}
.pu-line{display:grid;grid-template-columns:70px 1fr 140px 150px 28px;gap:8px;align-items:center;padding:7px 8px;border:1px solid var(--bd);border-radius:7px;margin-bottom:5px;background:var(--bg3);font-size:13px}
.pu-t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.pu-s{color:var(--t2);font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px}
.pu-q input{width:56px;background:var(--bg2);border:1px solid var(--bd2);border-radius:5px;color:var(--t1);padding:3px 5px}
.pu-tot{text-align:right;font-weight:800;font-size:15px;margin:6px 4px}.pu-none{font-size:12px;color:var(--t3);padding:10px 4px}
.pu-foot{margin-top:12px;font-size:10px;line-height:1.6;color:var(--t3);border-top:1px solid var(--bd);padding-top:8px}
#pkmod{position:fixed;inset:0;z-index:99995;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;padding:14px}
#pkmod.on{display:flex}
.pk-box{position:relative;background:var(--bg2);border:1px solid var(--bd2);border-radius:14px;width:min(1500px,98vw);height:calc(94*var(--uh,1vh));max-height:94vh;display:flex;flex-direction:column;color:var(--t1);font-family:var(--mono);overflow:hidden}
.pk-top{display:flex;gap:8px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--bd);flex-wrap:wrap}
.pk-top b{font-size:15px;margin-right:6px}.pk-top input[type=search]{flex:1;min-width:200px;background:var(--bg3);border:1px solid var(--bd2);border-radius:6px;color:var(--t1);padding:7px 10px;font-size:13px}
.pk-top input[type=date]{background:var(--bg3);border:1px solid var(--bd2);border-radius:6px;color:var(--t1);padding:6px 8px;font-size:12px}
.pk-main{flex:1;min-height:0;display:flex}
#pk-side{display:none;width:330px;flex:none;border-right:1px solid var(--bd);padding:14px;overflow:auto;position:relative}
#pk-side.on{display:block}
.pk-sx{position:absolute;top:6px;right:8px;background:transparent;border:0;color:var(--t2);cursor:pointer;font-size:15px}
.pk-img{width:100%;border-radius:8px;display:block;background:var(--bg3);min-height:60px}.pk-img.ph{display:flex;align-items:center;justify-content:center;height:140px;color:var(--t3);font-size:12px}
.pk-st{font-size:13px;font-weight:700;margin:8px 0 2px}.pk-or{font-size:11px;color:var(--t3);margin-bottom:8px}
.pk-ck{list-style:none;padding:0;margin:0 0 8px;font-size:13px}.pk-ck li{padding:2px 0}.pk-ck li.ok{color:var(--gn)}.pk-ck li.no{color:var(--rd)}
.pk-ls{font-size:12px;margin-bottom:10px}.pk-ac{display:flex;flex-direction:column;gap:6px;margin-bottom:10px}
#pk-tbl{flex:1;min-width:0;overflow:auto;position:relative}
.pk-t{width:100%;border-collapse:collapse;font-size:15px}
.pk-t th small{display:block;font-size:9px;font-weight:400;text-transform:none;letter-spacing:0;color:var(--t3)}
.pk-t th{position:sticky;top:0;background:var(--bg3);text-align:left;padding:8px 10px;font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--t3);border-bottom:1px solid var(--bd);z-index:1}
.pk-t td{padding:10px 10px;border-bottom:1px solid var(--bd);vertical-align:middle}.pk-t .n{text-align:right;white-space:nowrap}
.pk-r{cursor:pointer}.pk-r:hover{background:var(--bg3)}.pk-r.sel{background:var(--dim)}.pk-r.done td{opacity:.5;text-decoration:line-through}
.pk-r.pkp{background:rgba(70,140,255,.13);box-shadow:inset 4px 0 0 #4a8cff}.pk-r.pkp:hover{background:rgba(70,140,255,.22)}
.stbadge.pku{color:#4a8cff;border-color:#4a8cff}
.pk-ti{max-width:340px}.pk-ed{cursor:text;min-width:60px}.pk-ed:hover{outline:1px dashed var(--am)}
.pk-in{width:100%;box-sizing:border-box;background:var(--bg3);border:1px solid var(--am);border-radius:4px;color:var(--t1);padding:4px 6px;font-size:15px}
.pk-po{cursor:pointer;color:var(--am);font-weight:700;white-space:nowrap}
.pk-st.link{cursor:pointer;color:var(--am);text-decoration:underline}
.pk-st{font-size:15px}
.pk-ck{font-size:15px}.pk-ls,.pk-or{font-size:13px}
#pk-foot{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:8px 14px;border-top:1px solid var(--bd);font-size:11px;color:var(--t3);background:var(--bg3)}
.pk-step{position:relative;padding:3px 9px;border:1px solid var(--bd2);border-radius:12px;color:var(--t1);cursor:help}
.pk-step:hover::after,.pk-step:focus::after{content:attr(data-t);position:absolute;bottom:calc(100% + 8px);left:0;width:270px;white-space:normal;background:var(--bg2);border:1px solid var(--am);color:var(--t1);padding:7px 9px;border-radius:7px;font-size:11px;line-height:1.5;z-index:10;box-shadow:0 4px 16px rgba(0,0,0,.4)}
.pk-arr{color:var(--t3)}.pk-fn{margin-left:auto;color:var(--am);font-weight:600}
.pkf-ed{border:1px solid var(--bd2);background:var(--bg3);color:var(--t1);border-radius:50%;width:22px;height:22px;cursor:pointer;font-size:11px;padding:0;flex:none}
.pkf-sold{border-color:var(--gn)}.pkf-sold .pkf-pt{color:var(--gn)}
.pd-q{width:100%;box-sizing:border-box;background:var(--bg3);border:1px solid var(--bd2);border-radius:6px;color:var(--t1);padding:7px 10px;font-size:13px;margin-bottom:8px}
.pd-sec{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--t3);margin:10px 0 6px}
.pd-none{font-size:11px;color:var(--t3);padding:4px 2px}
.cvst{margin-top:5px;font-size:10px;font-weight:800;letter-spacing:.04em;color:var(--rd);border:1px dashed var(--rd);border-radius:5px;padding:3px 6px;line-height:1.35}
.cvst i{display:block;font-weight:400;font-style:normal;color:var(--t3);letter-spacing:0}
.pk-del{border:1px solid var(--rd);color:var(--rd);background:transparent;border-radius:50%;width:20px;height:20px;cursor:pointer;font-size:12px;line-height:1;padding:0}
#pk-more{padding:12px;text-align:center;color:var(--t3);font-size:11px}
#pk-up{display:none;position:absolute;right:22px;bottom:18px;z-index:3;border:1px solid var(--bd2);background:var(--bg3);color:var(--t1);border-radius:20px;padding:6px 14px;font-size:12px;cursor:pointer;box-shadow:0 2px 10px rgba(0,0,0,.3)}
#pk-up.on{display:block}
@media(max-width:768px){.pk-main{flex-direction:column}#pk-side{width:auto;max-height:45%;border-right:0;border-bottom:1px solid var(--bd)}}
:root{--bg:#101012;--bg2:#1d1d1d;--bg3:#242424;--bg4:#2b2b2b;--bg5:#34343a;--fn:var(--mono);--r:8px}
.vb.gn{color:var(--gn);border-color:rgba(92,180,126,.4)}
.vb .abn{margin-left:5px;font-weight:700;color:var(--am)}
.abn:empty{display:none}
.bchip{display:inline-flex;align-items:center;gap:6px;margin-left:8px;padding:1px 9px;border:1px solid var(--ab);border-radius:12px;color:var(--am);background:var(--dim);cursor:pointer;font-size:12px}
.bchip:hover{border-color:var(--am)}
#brandpop{max-height:60vh;overflow-y:auto}
.sp-row .bn{margin-left:auto;padding-left:10px;color:var(--t3);font-size:11px}
.dvst{margin:10px 0 2px;font-size:13px;color:var(--t2)}.dvst b{color:var(--am)}
.dvst.sold{color:var(--gn)}.dvst.sold b{color:var(--gn)}
.dpol{border:1px solid var(--bd2);border-radius:10px;background:var(--card);margin:6px 2px 14px;overflow:hidden}
.dpol-hd{display:flex;justify-content:space-between;align-items:center;padding:11px 16px;cursor:pointer;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--t2)}
.dpol-hd i{transition:transform .15s}.dpol.min .dpol-hd i{transform:rotate(-90deg)}.dpol.min .dpol-bd{display:none}
.dpol-bd{padding:2px 18px 16px;font-size:13px;line-height:1.7;color:var(--t1)}
.dpol-bd h4{font-size:12px;letter-spacing:.07em;color:var(--am);margin:12px 0 2px}.dpol-bd p{margin:0 0 4px;color:var(--t2)}
.dmore{margin:6px 2px 24px;padding:16px 12px 18px;border:1px solid var(--bd);border-radius:12px;background:var(--bar)}
.dmore-l{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--t3);margin:0 0 12px 4px}
.dmore-g{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
@media(max-width:768px){.dmore-g{grid-template-columns:1fr 1fr;gap:8px}.dmore-g .mw-card:nth-child(n+7){display:none}}
#pkmod .pill,#pdmod .pill,#pumod .pill,#pkform .pill,#mxmod .pill{font-family:var(--mono)}
.pk-box{font-family:var(--mono)}
#bkimgmod{z-index:100001!important}

</style>
</head>
<body>

<div class="mockwin" role="application" aria-label="R Auto Parts storefront">

  <!-- title bar — vendor entry lives here (click the title) -->
  <div class="mw-bar">
    <span class="dot r"></span><span class="dot y"></span><span class="dot g"></span>
    <button class="mw-title" id="tt" onclick="Vnd.gate()" title="rautoparts — click for vendor access"></button>
    <span class="mw-live" id="live">live</span>
  </div>

  <div class="mw-body">

    <!-- toolbar: logo · live search · sort · basket -->
    <div class="mw-head">
      <button class="mw-logo" onclick="Browse.reset()" title="store home — back to the main page, clears search, brand and sort"><i class="fa-solid fa-car"></i></button>
      <div class="mw-search">
        <i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i>
        <input id="si" placeholder="brake pads, alternators, filters…" autocomplete="off" spellcheck="false"
               oninput="Browse.search(this.value)" aria-label="Search listings">
        <button id="si-x" onclick="Browse.clearSearch()" title="Clear search" aria-label="Clear search"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <div class="sqwrap">
        <button class="mw-sq" id="sortbtn" onclick="SortMenu.toggle(event)" title="Sort — 6 modes"><i class="fa-solid fa-table-list"></i></button>
        <div class="pop" id="sortpop" role="menu"></div>
      </div>
      <div class="sqwrap">
        <button class="mw-sq" id="brandbtn" onclick="Browse.brandMenu(event)" title="Browse by brand"><i class="fa-solid fa-tags"></i></button>
        <div class="pop" id="brandpop" role="menu"></div>
      </div>
      <div class="sqwrap">
        <button class="mw-sq am" onclick="Basket.open()" title="Basket"><i class="fa-solid fa-basket-shopping"></i><span class="baskn" id="baskn"></span></button>
      </div>
    </div>

    <!-- toolbar — detail back button + vendor strip (configs §12); detail buttons mount into #vbdet -->
    <div id="vendbar">
      <button class="vb" id="vbback" onclick="Det.close()" style="display:none" title="Back to the store">
        <i class="fa-solid fa-arrow-left"></i> back to <b id="vbbn">rautoparts</b></button>
      <span class="vend" style="display:contents">
        <button class="vb am" onclick="Ed.open()" title="Add a new listing"><i class="fa-solid fa-plus"></i> New</button>
        <button class="vb" onclick="Vnd.exportJSON()" title="Download all listings as JSON"><i class="fa-solid fa-download"></i> Export</button>
        <button class="vb rd" id="b64btn" onclick="DB.pick()" title="Link B64 folder (required to add/edit listings)"><i class="fa-solid fa-database"></i> B64</button>
        <button class="vb" id="bibtn" onclick="Biz.open()" title="Business name · PayPal address · hours · vendor password — saved to latest.b64"><i class="fa-solid fa-address-card"></i> Business Info</button>
        <button class="vb" id="pend-btn" onclick="Sx.panel()" title="Pending sold and recently sold orders"><i class="fa-solid fa-hourglass-half"></i> Pending<span id="pend-n" class="abn"></span></button>
        <button class="vb" id="pk-btn" onclick="Pk.open()" title="Packages list (packages.b64)"><i class="fa-solid fa-boxes-packing"></i> Packages</button>
        <span id="vbdet"></span>
        <span style="flex:1"></span>
        <button class="vb" id="oosbtn" onclick="Browse.toggleOos()" title="Show or hide out-of-stock listings"><i class="fa-solid fa-eye"></i> OOS shown</button>
        <button class="vb" onclick="Vnd.logout()" title="End vendor session"><i class="fa-solid fa-right-from-bracket"></i> Logout</button>
      </span>
    </div>

    <div id="rline"></div>

    <!-- views -->
    <div class="views" id="views">
      <div id="view-browse" class="view on"><div id="grid"></div></div>
      <div id="view-detail" class="view"></div>
    </div>

  </div>

  <!-- status bar — all numbers computed from live data -->
  <div class="mw-foot" id="mwfoot"></div>

</div>

<!-- ── vendor gate (configs §10 modal.vendor-auth · CFG.PASS §29) ── -->
<div class="mmod" id="vmod">
  <div class="mbox" style="max-width:320px">
    <h3><b>vendor</b> access</h3>
    <input class="fi" id="vpin" type="password" inputmode="numeric" placeholder="PIN" maxlength="24"
           onkeydown="if(event.key==='Enter')Vnd.login()" aria-label="Vendor PIN">
    <div class="mrow">
      <button class="mbtn" onclick="Vnd.closeGate()">Cancel</button>
      <button class="mbtn pri" onclick="Vnd.login()"><i class="fa-solid fa-lock"></i> Unlock</button>
    </div>
  </div>
</div>

<!-- ── listing editor (basic subset of configs §12 ed.fields) ── -->
<div class="mmod" id="emod">
  <div class="mbox wide">
    <h3 id="edtitle"><b>new</b> listing</h3>
    <label class="flab">Title <span class="req">*</span></label>
    <input class="fi" id="f-title" maxlength="75" placeholder="e.g. Ceramic Brake Pads — Front Pair">
    <div class="f2">
      <div><label class="flab">Price USD <span class="req">*</span></label><input class="fi" id="f-price" type="number" min="0" step="0.01" placeholder="0.00"></div>
      <div><label class="flab">Stock qty</label><input class="fi" id="f-stock" type="number" min="0" step="1" placeholder="0"></div>
      <div><label class="flab">Stock # / SKU</label><input class="fi" id="f-sku" placeholder="BATT-68AH"></div>
      <div><label class="flab">Category</label><input class="fi" id="f-cat" placeholder="Brakes"></div>
      <div><label class="flab">Part #</label><input class="fi" id="f-part" placeholder="D1234"></div>
      <div><label class="flab">Bin loc</label><input class="fi" id="f-loc" placeholder="D1-01"></div>
      <div><label class="flab">Interchange</label><input class="fi" id="f-int" placeholder="nums separated by space"></div>
      <div><label class="flab">Brand</label><input class="fi" id="f-brand" placeholder="StopSure"></div>
      <div><label class="flab">Condition</label>
        <select class="fi" id="f-cond">
          <option value="new">New</option><option value="used">Used</option>
          <option value="refurbished">Refurbished</option><option value="damaged">Damaged / Parts</option>
        </select></div>
      <div><label class="flab">Shipping USD</label><input class="fi" id="f-ship" type="number" min="0" step="0.01" placeholder="0.00"></div>
      <div><label class="flab">Weight lbs</label><input class="fi" id="f-wt" placeholder="2.5"></div>
      <div><label class="flab">Size L x W x H</label><input class="fi" id="f-dim" placeholder="16x12x8"></div>
      <div><label class="flab">Initials</label><input class="fi" id="f-init" maxlength="2" placeholder="AB"></div>
    </div>
    <label class="flab">Card icon</label>
    <select class="fi" id="f-icon"></select>
    <label class="flab">Photo (auto-resized to 1200×800 webp + 240×160 thumb)</label>
    <div style="display:flex;gap:8px;align-items:center">
      <input class="fi" id="f-img" type="file" accept="image/*" style="padding:6px">
      <img class="imgprev" id="f-prev" alt="">
      <button class="mbtn" id="f-imgx" onclick="Ed.clearImg()" style="display:none">✕</button>
    </div>
    <label class="flab">Short description</label>
    <textarea class="fi" id="f-desc" placeholder="One-liner shown on the detail page"></textarea>
    <label class="chkrow"><input type="checkbox" id="f-oos"> Out of stock (hidden from customers)</label>
    <div class="mrow">
      <button class="mbtn" onclick="Ed.close()">Cancel</button>
      <button class="mbtn pri" onclick="Ed.save()"><i class="fa-solid fa-check"></i> Save listing</button>
    </div>
  </div>
</div>

<!-- ── business info (vendor) — saved into the latest.b64 manifest · header + back button follow the name ── -->
<div class="mmod" id="bimod">
  <div class="mbox">

<script>
'use strict';
/* ═══ CFG — editable constants (configs.flat.txt §29 + storefront head block) ═══ */

const STORE_NAME='R Auto Parts';       // cfg.NAME
const CFG={
  NAME:STORE_NAME, PP_EMAIL:PAYPAL_EMAIL, PP_CUR:'USD',

/* §06 nav.sort.options — exactly the storefront's 6 browse sorts */
const SORTS=[['new','Newest'],['pa','Price ↑'],['pd','Price ↓'],['az','A–Z'],['szd','Stock Z-A'],['edited','Edited Z-A']];
/* vendor stats bar removed per vendor request — stats() still feeds the status bar + LIVE badge */
/* card icon palette for the editor */
const ICONS=['fa-car-battery','fa-oil-can','fa-fan','fa-bolt','fa-filter','fa-compact-disc','fa-fire','fa-plug',
 'fa-circle-notch','fa-link','fa-wind','fa-temperature-low','fa-temperature-half','fa-droplet','fa-snowflake',
 'fa-lightbulb','fa-power-off','fa-gears','fa-cloud-rain','fa-clone','fa-compress','fa-ruler-horizontal',
 'fa-circle-dot','fa-gas-pump','fa-door-open','fa-cube'];
const COND={new:'New',used:'Used',refurbished:'Refurbished',damaged:'Damaged / Parts'};

const E=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const $=id=>document.getElementById(id);

/* salted password hash — SHA-256 where the context allows it, deterministic fallback otherwise;
   the same function runs at set-time (Business Info) and check-time (login / refresh guard) */
async function hashPw(pw,salt){
  const s=String(salt||'')+'::'+String(pw==null?'':pw);
  try{
    if(window.crypto&&crypto.subtle&&crypto.subtle.digest){
      const buf=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));
      return[...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,'0')).join('');
    }
  }catch(e){}
  let h1=5381,h2=52711;
  for(let i=0;i<s.length;i++){const c=s.charCodeAt(i);h1=((h1*33)^c)>>>0;h2=((h2*31)+c)>>>0}
  return 'x'+h1.toString(16)+h2.toString(16);
}

/* ═══ SEED CATALOG — real listings; first five match the reference shot (newest first) ═══
   schema.item §29 (trimmed basic subset) */
function seed(){
  const D=864e5,n=Date.now();let k=45;const ts=()=>n-(k--)*D;
  const I=(id,title,price,sku,stock,category,partNum,loc,interchange,brand,cond,icon,cr,extra)=>(

  return[
    I(31,'Car Battery 12V 68Ah — Group 48',119.00,'BATT-68AH',8,'Electrical','P48-68AGM','A1-04','48 48AGM H5','Volta','new','fa-car-battery',2),
    I(30,'SAE 5W-30 Full Synthetic Motor Oil — 1 Qt',8.49,'OIL-5W30',40,'Fluids','5W30-QT1','A2-11','5W30 GF6','LubriMax','new','fa-oil-can',3),
    I(29,'Radiator Cooling Fan Assembly',64.00,'FAN-RAD2',5,'Cooling','FAN-2247','B3-02','2247 621-220','AeroFlow','used','fa-fan',5),
    I(28,'Alternator 120A — Remanufactured',89.00,'ALT-120A',6,'Electrical','ALT-13973','B1-07','13973 8307 334-2110','VoltCore','refurbished','fa-bolt',6),
    I(27,'Engine Air Filter',12.50,'FLT-A330',25,'Filters','A330-ENG','C2-05','A330 CA9831','AirGuard','new','fa-filter',7),
    I(26,'Ceramic Brake Pads — Front Pair',34.99,'BRK-PADF',14,'Brakes','CD1234-F','D1-01','D1234','StopSure','new','fa-compact-disc',8),
    I(25,'Brake Rotor — Rear',52.00,'BRK-ROTR',10,'Brakes','BR5402','D1-03','BR5402 580213R','StopSure','new','fa-compact-disc',9),
    I(24,'Alternator 160A High Output',129.00,'ALT-160A',0,'Electrical','ALT-160HO','B1-08','160HO','VoltCore','new','fa-bolt',10,{oos:true}),
    I(23,'Iridium Spark Plug',7.25,'SPK-IR6',60,'Ignition','IR6-9412','E1-09','9412 ILZKR7B11','SparkPro','new','fa-fire',11),
    I(1,'Door Handle Exterior — Left',22.00,'DOR-LH1',3,'Exterior','DH-80670','F2-08','80670','ClearVue','used','fa-door-open',40,{status:'ended',endReason:'ended',ended:n-9*D})
  ];
}

/* placeholder listings (seed) are dropped the moment real b64 data is pulled — from /src (deployed) or the linked folder */
const SEEDSIG=new Set(seed().map(i=>i.id+'|'+i.sku));
function purgeSeed(){const n=ITEMS.length;ITEMS=ITEMS.filter(i=>!(i&&(i.seed||SEEDSIG.has(i.id+'|'+i.sku))));return n-ITEMS.length}
window._b64Loaded=false; /* true once real b64 data (manifest or folder scan) has been read */
/* ═══ STORE — listing + photo persistence (IndexedDB, localStorage fallback) ═══
   Photos blew through the ~5MB localStorage quota ("Storage full — try a smaller photo"),
   so the catalog now lives in IndexedDB (hundreds of MB available). localStorage keeps only
   tiny keys (basket · business info · flags) and serves as the legacy fallback: an existing
   bs_items_v1 catalog is migrated into IndexedDB on first boot, then removed to free quota. */
const LS={
  KI:'bs_items_v1',KB:'bs_basket_v1',
  load(k){try{const v=JSON.parse(localStorage.getItem(k));return v&&typeof v==='object'?v:null}catch{return null}},
  save(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch{Toast('Storage full — try a smaller photo',3600);return false}}
};
/* tiny IndexedDB key/value layer — same pattern as the B64 folder-handle store ('storefront-b64') */
const Store=(()=>{
  const DBN='bs_store_v1',ST='kv',ok=('indexedDB' in window);
  let _db=null;
  function db(){
    if(!ok)return Promise.reject(new Error('IndexedDB unavailable'));
    if(_db)return _db;
    _db=new Promise((res,rej)=>{
      const r=indexedDB.open(DBN,1);
      r.onupgradeneeded=()=>{try{r.result.createObjectStore(ST)}catch(e){}};
      r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);
    });
    _db.catch(()=>{_db=null}); /* a failed open must not poison later retries */
    return _db;
  }
  async function get(k){const d=await db();return await new Promise((res,rej)=>{
    const q=d.transaction(ST).objectStore(ST).get(k);
    q.onsuccess=()=>res(q.result===undefined?null:q.result);q.onerror=()=>rej(q.error)})}
  async function set(k,v){const d=await db();await new Promise((res,rej)=>{
    const t=d.transaction(ST,'readwrite');t.objectStore(ST).put(v,k);
    t.oncomplete=res;t.onerror=()=>rej(t.error)})}
  /* boot loader: IndexedDB catalog → legacy localStorage catalog (migrated once) → seed */
  async function loadItems(){
    let arr=null;
    if(ok){try{const v=await get('items');if(Array.isArray(v))arr=v}catch(e){}}
    if(!Array.isArray(arr)||!arr.length){
      const l=LS.load(LS.KI);
      if(Array.isArray(l)&&l.length){
        arr=l;
        if(ok){try{await set('items',arr);localStorage.removeItem(LS.KI)}catch(e){}}
      }
    }
    return Array.isArray(arr)&&arr.length?arr:seed();
  }
  return{ok:()=>ok,get,set,loadItems};
})();
let ITEMS=seed(); /* placeholder until boot replaces it with the stored catalog */
/* every write is serialized and snapshots the live ITEMS at run time; IndexedDB first,
   localStorage only as the last-resort fallback (its quota toast fires there, as before) */
let _saveQ=Promise.resolve();
function saveItems(){
  _saveQ=_saveQ.then(async()=>{
    if(Store.ok()){try{await Store.set('items',ITEMS);return}catch(e){}}
    LS.save(LS.KI,ITEMS);
  }).catch(()=>{});
  return _saveQ;
}
const nid=()=>ITEMS.reduce((m,i)=>Math.max(m,+i.id||0),0)+1;
const get=id=>ITEMS.find(i=>i.id===+id)||null;

function stats(){ /* §12 act.stats.set — Active / Ended / In Stock / Value */
  const a=ITEMS.filter(i=>i.status!=='ended'&&!i.oos),e=ITEMS.filter(i=>i.status==='ended');
  return{active:a.length,ended:e.length,inStock:a.filter(i=>(i.stock||0)>0).length,
    val:a.reduce((s,i)=>s+(i.price||0)*(i.stock||0),0)};
}

/* ═══ SEARCH — verbatim behavior from storefront matchItem (§21 beh.search) ═══
   fields: title, stock #, part #, loc, c-part, category, interchange numbers */
function matchItem(i,q){
  const words=String(q||'').toLowerCase().split(/\s+/).filter(Boolean);if(!words.length)return true;
  const hay=[i.title,i.sku,i.partNum,i.loc,i.cpart,i.category,i.interchange].map(v=>v||'').join(' ').toLowerCase();
  const ints=String(i.interchange||'').toLowerCase().split(/[\s,;\/]+/).map(t=>t.replace(/[^a-z0-9]/g,'')).filter(Boolean);
  return words.every(w=>{if(hay.includes(w))return true;const wn=w.replace(/[^a-z0-9]/g,'');return wn.length>=3&&ints.some(t=>t.includes(wn))});
}

/* out-of-stock helpers — a vendor can type "out of stock" in the search bar to pull them all up */
const OOS_WORDS=new Set(['outofstock','oos']);
const normQ=s=>String(s||'').toLowerCase().replace(/[^a-z]/g,'');
const isOos=i=>i.status!=='ended'&&(!!i.oos||(i.stock||0)<=0);
</script>
<script>
'use strict';
/* ═══ BROWSE — ported from storefront Browse module (query · render · infinite scroll · lazy thumbs) ═══ */
const Browse=(()=>{
  let q='',_brand='',sort=CFG.DEFAULT_BROWSE_SORT,perPage=CFG.PER_PAGE,_vis=0,_matched=[],_loading=false,_obs=null,_tobs=null,_built=false,_oosQ=false,
    hideOos=(()=>{try{return localStorage.getItem('bs_ooshide')==='1'}catch(e){return false}})(), /* vendor OOS show/hide toggle */
    _st=null,_restoring=false;
  /* ── browse-state memory — search · sort · cards loaded · scroll position ──
     saved on every render / scroll / search (empty searches included) so the browser back
     button, "back to {business}" and a plain reload land on the exact same view */
  const SKEY='bs_browse_v1';
  let _saved={q:'',brand:'',sort:CFG.DEFAULT_BROWSE_SORT,vis:0,scroll:0};

  function all(){ /* DS.query comparators — same truth, vendor sees ended/oos */
    let r=ITEMS.filter(i=>Vnd.on()||(i.status!=='ended'&&!i.oos));
    _oosQ=!!(Vnd.on()&&q&&OOS_WORDS.has(normQ(q))); /* typing "out of stock" pulls up every OOS listing */
    if(_brand){const b=_brand.toLowerCase();r=r.filter(i=>String(i.brand||'').trim().toLowerCase()===b)}
    if(q){if(_oosQ)r=r.filter(isOos);else r=r.filter(i=>matchItem(i,q))}
    if(!_oosQ&&Vnd.on()&&hideOos)r=r.filter(i=>!isOos(i));
    if(sort==='pa')r.sort((a,b)=>(a.price||0)-(b.price||0));
    else if(sort==='pd')r.sort((a,b)=>(b.price||0)-(a.price||0));
    else if(sort==='az')r.sort((a,b)=>(a.title||'').localeCompare(b.title||''));
    else if(sort==='szd')r.sort((a,b)=>(b.sku||'').localeCompare(a.sku||''));
    else if(sort==='edited')r.sort((a,b)=>(b.updated||b.created||0)-(a.updated||a.created||0));
    else r.sort((a,b)=>(b.id||0)-(a.id||0));
    return r;
  }

  function card(i){
    const th=(i.thumbs&&i.thumbs[0])||'';
    const media=th?`<img class="cimg" data-ci="${i.id}" src="${th}" alt="">`
                  :`<div class="mw-cimg cph" data-ci="${i.id}"><i class="fa-solid ${E(i.icon||'fa-cube')}" aria-hidden="true"></i></div>`;
    const ended=i.status==='ended';
    const tag=(ended?' · <span class="oos">ENDED</span>':(i.oos?' · <span class="oos">OUT OF STOCK</span>':''))+(Vnd.on()?Sx.rowBadges(i)+(isPackaged(i)?'<span class="stbadge pku">PACKAGED</span>':''):'');
    return `<div class="mw-card${ended?' ended':''}" data-id="${i.id}" onclick="Det.open(${i.id})">`+
      `<div class="mw-cimg">${media}</div>`+
      `<div class="mw-cbody"><div class="mw-ct">${E(i.title)}</div>`+
      `<div class="mw-cp">${typeof i.price==='number'?'$'+i.price.toFixed(2):'—'}</div>`+
      `<div class="mw-csku">${E(i.sku||'')}${tag}</div></div></div>`;
  }

  function _updInfo(){
    const tot=_matched.length,rl=$('rline');
    const bc=_brand?` <span class="bchip" onclick="Browse.setBrand('')" title="Clear brand filter">brand: ${E(_brand)} <i class="fa-solid fa-xmark"></i></span>`:'';
    if(rl&&!q&&_brand){rl.style.display='block';rl.innerHTML=`<b>${tot}</b> listing${tot!==1?'s':''}`+bc}
    else if(rl){if(q){rl.style.display='block';
      rl.innerHTML=_oosQ?`<b>${tot}</b> out-of-stock listing${tot!==1?'s':''} — open one to restock, edit or end it`
                        :`<b>${tot}</b> listing${tot!==1?'s':''} for \u201c${E(q)}\u201d`+bc}
     else rl.style.display='none'}
  }

  function render(){
    _matched=all();
    const tot=_matched.length;
    if(!_vis)_vis=Math.min(perPage,Math.max(tot,0));
    const g=$('grid');
    if(!tot){
      const et=q?(_oosQ?'No out-of-stock items':'No results'):(window._b64Loaded?'No active listings':'Empty store');
      const es=_oosQ?'Everything active is in stock.':(Vnd.on()?'Use + New to add listings.':'Try brake, filter, electrical…');
      g.innerHTML=`<div class="empty">${window._b64Loaded?'':'<div class="ei">📦</div>'}<div class="et">${et}</div><div class="es">${es}</div></div>`;
      hideSent();
    }else{
      g.innerHTML=_matched.slice(0,_vis).map(card).join('')+
        `<div id="loadMoreTrigger"></div><div id="loadingIndicator">Loading more listings…</div><div id="endOfList">end of listings</div>`;
      if(_vis<tot)showSent();
      else{hideSent();const e=$('endOfList');if(e&&tot>perPage)e.style.display='block'}
      lazyThumbs();
    }
    _updInfo();
    chrome();
    saveState(); /* remember q · sort · cards loaded · scroll for back-navigation + reload */
  }

  /* lazy thumbnails — IntersectionObserver rootMargin 200px (§07 card.lazyload);
     static deploy: a placeholder also triggers one /src packet fetch to hydrate the photo */
  function lazyThumbs(){
    if(!_tobs)_tobs=new IntersectionObserver(es=>{es.forEach(en=>{
      if(!en.isIntersecting)return;_tobs.unobserve(en.target);
      const id=+en.target.dataset.ci,i=get(id);
      const swap=it=>{const im=document.createElement('img');im.className='cimg';im.dataset.ci=id;im.loading='lazy';im.alt='';im.src=it.thumbs[0];en.target.replaceWith(im)};
      if(i&&i.thumbs&&i.thumbs[0]){swap(i)}
      else if(i&&Static.on()&&Static.need(id)){
        Static.fetchItem(id).then(okk=>{const j=get(id);
          if(okk&&j&&j.thumbs&&j.thumbs[0]&&en.target.isConnected)swap(j);
        });
      }
    })},{root:$('views'),rootMargin:CFG.THUMB_MARGIN});
    document.querySelectorAll('#grid .cph[data-ci],#dmore-grid .cph[data-ci]').forEach(el=>_tobs.observe(el));
  }

  function showSent(){const s=$('loadMoreTrigger');if(s)s.style.display='block';reobserve()}
  function hideSent(){const s=$('loadMoreTrigger');if(s)s.style.display='none';const li=$('loadingIndicator');if(li)li.style.display='none'}
  function reobserve(){
    if(!_obs)return;const s=$('loadMoreTrigger');_obs.disconnect();if(s)_obs.observe(s);
  }
  function loadMore(){
    if(_loading)return;
    const tot=_matched.length;
    if(_vis>=tot){hideSent();return}
    _loading=true;
    const li=$('loadingIndicator');if(li)li.style.display='block';
    setTimeout(()=>{
      const start=_vis,end=Math.min(start+perPage,tot);
      const g=$('grid'),sent=$('loadMoreTrigger');
      if(g&&end>start){
        const frag=document.createElement('div');
        frag.innerHTML=_matched.slice(start,end).map(card).join('');
        while(frag.firstChild)(sent||g).parentNode.insertBefore(frag.firstChild,sent||null);
        _vis=end;
      }
      if(li)li.style.display='none';
      _loading=false;
      lazyThumbs(); /* cards appended past page 1 must be observed too, or their photos never hydrate */
      saveState();
      if(_vis>=tot){hideSent();const e=$('endOfList');if(e&&tot>perPage)e.style.display='block'}
      else{showSent();setTimeout(()=>{const s=$('loadMoreTrigger');if(s&&s.style.display!=='none'&&s.getBoundingClientRect().top<innerHeight+300)loadMore()},80)}
    },80);
  }

  /* vendor OOS toggle — show/hide out-of-stock listings in the grid (persisted) */
  function oosBtn(){
    const b=$('oosbtn');if(!b)return;
    b.classList.toggle('am',hideOos);
    b.innerHTML=hideOos?'<i class="fa-solid fa-eye-slash"></i> OOS hidden':'<i class="fa-solid fa-eye"></i> OOS shown';
    b.title=hideOos?'Out-of-stock listings are hidden — click to show them'
                    :'Out-of-stock listings are shown — click to hide them';
  }
  function toggleOos(){
    hideOos=!hideOos;try{localStorage.setItem('bs_ooshide',hideOos?'1':'0')}catch(e){}
    _vis=0;oosBtn();$('views').scrollTop=0;render();
  }
  function init(){
    _obs=new IntersectionObserver(es=>{es.forEach(en=>{if(en.isIntersecting)loadMore()})},{root:$('views'),rootMargin:CFG.SCROLL_MARGIN});
    /* remember the scroll position while browsing (throttled; skipped while a listing is
       open — the shared container is parked at 0 there and must not clobber the memory) */
    $('views').addEventListener('scroll',()=>{if(_st||_restoring)return;_st=setTimeout(()=>{_st=null;saveState()},250)},{passive:true});
    _built=true;oosBtn(); /* reflect the persisted OOS show/hide state on the vendbar button */
  }
  function search(v){q=String(v||'');_vis=0;$('si-x').classList.toggle('show',!!q);
    if($('view-detail').classList.contains('on'))Det.toBrowse(); /* typing on an item page = store search: leave the item, show the results */
    $('views').scrollTop=0;render()}
  function clearSearch(){$('si').value='';search('')}
  function sortSel(v){sort=v;_vis=0;$('views').scrollTop=0;SortMenu.sync();render()}
  function reset(){ /* store home: leave any item page, clear search + brand + sort, back to the top of the main page */
    q='';_brand='';sort=CFG.DEFAULT_BROWSE_SORT;_vis=0;$('si').value='';$('si-x').classList.remove('show');
    if($('view-detail').classList.contains('on'))Det.toBrowse();
    try{SortMenu.close();$('brandpop').classList.remove('on');Pk.close();const pm=$('pdmod');if(pm)pm.remove()}catch(e){}
    _updBrandBtn();$('views').scrollTop=0;SortMenu.sync();render();$('views').scrollTop=0;
  }
  /* brand filter */
  function brandList(){const m=new Map();ITEMS.forEach(i=>{if(!Vnd.on()&&(i.status==='ended'||i.oos))return;const v=String(i.brand||'').trim();if(!v)return;const k=v.toLowerCase(),e=m.get(k);if(e)e.n++;else m.set(k,{name:v,n:1})});return[...m.values()].sort((a,b)=>a.name.localeCompare(b.name))}
  function _updBrandBtn(){const b=$('brandbtn');if(!b)return;b.classList.toggle('am',!!_brand);b.title=_brand?'Brand: '+_brand+' (click to change)':'Browse by brand'}
  function brandMenu(e){
    if(e)e.stopPropagation();const pop=$('brandpop');SortMenu.close();
    const list=brandList();
    pop.innerHTML=`<div class="sp-hd">brand ? ${list.length}</div>`.replace('?','·')+
      `<div class="sp-row${_brand?'':' on'}" data-b="" onclick="Browse.setBrand(this.dataset.b)">All brands<i class="fa-solid fa-check"></i></div>`+
      (list.length?list.map(c=>`<div class="sp-row${c.name.toLowerCase()===_brand.toLowerCase()?' on':''}" data-b="${E(c.name)}" onclick="Browse.setBrand(this.dataset.b)">${E(c.name)} <span class="bn">${c.n}</span><i class="fa-solid fa-check"></i></div>`).join(''):'<div class="sp-hd">no brands yet</div>');
    pop.classList.toggle('on');
  }
  function setBrand(b){
    _brand=b||'';_vis=0;$('brandpop').classList.remove('on');_updBrandBtn();
    if($('view-detail').classList.contains('on'))Det.toBrowse();
    $('views').scrollTop=0;render();
  }
  /* ── state-memory API (used by Det · popstate · boot) ── */
  function stateSnapshot(){
    return{q,brand:_brand,sort,vis:_vis,scroll:$('view-browse').classList.contains('on')?Math.round($('views').scrollTop||0):(_saved.scroll||0)};
  }
  function persistState(s){_saved=s;try{localStorage.setItem(SKEY,JSON.stringify(s))}catch(e){}}
  function saveState(){if(_restoring)return;if($('view-detail').classList.contains('on'))return;persistState(stateSnapshot())}
  function persistBrowse(){ /* captured the instant a listing is opened — Det.show(push) calls this */
    if($('view-browse').classList.contains('on'))persistState(stateSnapshot());
  }
  function _setScroll(sc){
    requestAnimationFrame(()=>{try{$('views').scrollTop=sc}catch(e){}
      setTimeout(()=>{try{$('views').scrollTop=sc}catch(e){}},80)});
  }
  function restoreScroll(s){ /* back/forward navigation — the grid is intact, just re-scroll it */
    const src=(s&&s.scroll!=null)?s:_saved;
    _setScroll(Math.max(0,Math.round(+src.scroll||0)));
  }
  function restoreSaved(){ /* boot — restore search · sort · cards loaded · scroll from the last visit */
    let s=null;try{s=JSON.parse(localStorage.getItem(SKEY)||'null')}catch(e){}
    if(!s||typeof s!=='object')return false;
    q=String(s.q||'');_brand=String(s.brand||'');_updBrandBtn();
    sort=SORTS.some(x=>x[0]===s.sort)?s.sort:CFG.DEFAULT_BROWSE_SORT;
    _vis=Math.max(0,Math.min(Math.round(+s.vis||0),2000));
    _saved={q,brand:_brand,sort,vis:_vis,scroll:Math.max(0,Math.round(+s.scroll||0))};
    $('si').value=q;$('si-x').classList.toggle('show',!!q);
    SortMenu.sync();
    _restoring=true;render();
    const sc=_saved.scroll;
    requestAnimationFrame(()=>{try{$('views').scrollTop=sc}catch(e){}
      setTimeout(()=>{try{$('views').scrollTop=sc}catch(e){}_restoring=false},80)});
    return true;
  }
  return{render,init,search,clearSearch,sortSel,reset,lazyThumbs,card,brandMenu,setBrand,curSort:()=>sort,toggleOos,oosBtn,oosMode:()=>_oosQ,
    saveState,persistBrowse,restoreSaved,restoreScroll};
})();

/* ═══ DETAIL — Det.open pattern: title swap · SEO · deeplink ?item= §27/§11 ═══ */
const Det=(()=>{
  let id=null,pushed=false; /* pushed: this listing was pushed onto the history stack */
  function partline(i){
    const b=[`Part # ${i.partNum||i.sku||'—'}`,CFG.RETURNS,`${CFG.HANDLING} handling`,`Ships via ${CFG.SVC}`,`arrives in ${CFG.ETA}`];
    if(i.loc)b.push(`Loc: ${i.loc}`);
    if(i.interchange)b.push(`Int: ${i.interchange}`);
    return b.join(' · ');
  }
  function show(i,push=true){
    const _keep=(!push&&$('view-detail').classList.contains('on'))?$('views').scrollTop:0; /* refresh keeps the scroll position */
    if(push)Browse.persistBrowse(); /* snapshot search + scroll BEFORE the browse view hides */
    id=i.id;
    const ended=i.status==='ended';
    const media=(i.images&&i.images[0])?`<img src="${i.images[0]}" alt="">`:`<i class="fa-solid ${E(i.icon||'fa-cube')}" aria-hidden="true"></i>`;
    const out=(i.stock||0)<=0&&!ended;
    $('view-detail').innerHTML=
      `<div class="dwrap">
         <div class="dimg">${media}</div>
         <div class="dinfo">
           ${ended?`<div class="dend">${i.endReason==='sold'?'sold':'ended'} · ${new Date(i.ended||Date.now()).toLocaleDateString()}</div>`:''}
           <div class="dtitle">${E(i.title)}</div>
           <div class="dprice">${typeof i.price==='number'?money(i.price):'—'}</div>
           <div class="dsku">${E(i.sku||'')}</div>
           <div class="dmeta">
             <div>Qty: <b>${out?'<span class="oos">Out of stock</span>':i.stock}</b></div>
             ${i.soldQty>0?`<div>Sold: <b>${i.soldQty}</b></div>`:''}
             ${i.category?`<div>Category: <b>${E(i.category)}</b></div>`:''}
             ${i.brand?`<div>Brand: <b>${E(i.brand)}</b></div>`:''}
             ${i.condition?`<div>Condition: <b>${E(COND[i.condition]||i.condition)}</b></div>`:''}
           </div>
           <div class="dline">${E(partline(i))}</div>
           ${Vnd.on()?vstat(i):''}
           ${ended?'':`<button id="dbuy" onclick="Basket.add(${i.id})" ${out?'disabled':''}>${out?'Out of stock':'Add to Basket'}</button>`}
         </div>
       </div>${policyBox(i)}${moreBox(i)}`;
    $('view-browse').classList.remove('on');
    $('view-detail').classList.add('on');
    $('views').scrollTop=_keep;try{Browse.lazyThumbs()}catch(e){}
    Vnd.detBar(i); /* vendor buttons (Edit/Sold/End/Delete) live in the vendbar, not under Add to Basket */
    barSync(); /* the back button rides the same bar as New/Export/B64 */
    document.title=i.title||CFG.NAME;
    seo(i);
    if(push){pushed=true;try{history.pushState({det:id},'','?item='+id)}catch(e){}}
  }
  async function open(x,push=true){ /* static deploy: hydrate the packet from /src before rendering */
    let i=get(x);
    if(i&&Static.on()&&Static.need(x)){try{await Static.fetchItem(x);i=get(x)||i}catch(e){}}
    if(i)show(i,push);
  }
  function toBrowse(){ /* leave the item page without touching the search / brand that is being typed */
    _closeView();try{history.replaceState({browse:1},'',''+location.pathname)}catch(e){}
  }
  function _closeView(){
    id=null;pushed=false;
    $('view-detail').classList.remove('on');
    $('view-browse').classList.add('on');
    Vnd.detBar(null);
    barSync();
    document.title=winTitle();
    seo(null);
  }
  function close(){
    /* pushed onto the stack → history.back() closes it (popstate restores search + scroll);
       deeplink loads close in place and clean the ?item= URL */
    if(pushed){try{history.back();return}catch(e){pushed=false}}
    _closeView();
    try{history.replaceState({browse:1},'',''+location.pathname)}catch(e){}
    Browse.restoreScroll();
  }
  function refresh(){const i=id!=null?get(id):null;if(i&&$('view-detail').classList.contains('on'))show(i,false)}
  /* vendor-only status under the price: pending sold / sold-not-packaged / packaged labels */
  function vstat(i){
    const st=Sx.status(i),un=Sx.unpackaged(i);
    let h=`<div class="dvst">Status: <b>${E(st)}</b>${isPackaged(i)?' <span class="stbadge pku">PACKAGED</span>':''}</div>`;
    h+=Sx.pendRows(i);
    if(un.length&&i.status!=='ended')h+=`<div class="dvst sold">Sold, not packaged yet: <b>${un.reduce((s,x)=>s+(x.qty||1),0)}</b> &middot; press Packaged to log it</div>`;
    return h;
  }
  /* Store Policy: collapsible box under the item details (plain text from Business Info, default text when blank) */
  function policyBox(i){
    if(i.status==='ended'||i.hidePolicy)return '';
    const raw=String(CFG.STORE_POLICY||DEFAULT_POLICY);
    const body=raw.split('\n').map(l=>{const t=l.trim();if(!t)return '';return /^[A-Z][A-Z0-9 &\/'-]{2,}[.:]?$/.test(t)?`<h4>${E(t)}</h4>`:`<p>${E(t)}</p>`}).join('');
    return `<div class="dpol" id="dpol"><div class="dpol-hd" onclick="Det.togPB()"><span>Store Policy</span><i class="fa-solid fa-chevron-down"></i></div><div class="dpol-bd">${body}</div></div>`;
  }
  function togPB(){const e=$('dpol');if(e)e.classList.toggle('min')}
  /* More like this / More in <category>, under the policy: shared part # first, then same category, then newest */
  function relList(it,n){
    const all=ITEMS.filter(x=>x.id!==it.id&&x.status!=='ended'&&!x.oos);
    const tk=v=>String(v||'').toLowerCase().split(/[\s,;\/]+/).filter(Boolean);
    const my=tk(it.cpart),mySet=new Set(my),myStr=my.join(' ');
    let cp=[];
    if(my.length)cp=all.map(x=>{const t=tk(x.cpart);if(!t.length)return null;const sh=t.filter(w=>mySet.has(w)).length;return sh?{x,ex:t.join(' ')===myStr?1:0,sh}:null}).filter(Boolean)
      .sort((a,b)=>b.ex-a.ex||b.sh-a.sh||(b.x.created||0)-(a.x.created||0)).map(o=>o.x);
    const cat=(it.category||'').trim().toLowerCase();
    const same=cat?all.filter(x=>(x.category||'').trim().toLowerCase()===cat):[];
    const out=[],used=new Set();
    const push=l=>{for(const x of l){if(out.length>=n)break;if(!used.has(x.id)){used.add(x.id);out.push(x)}}};
    push(cp.slice(0,5));push(same);push(all.slice().sort((a,b)=>(b.created||0)-(a.created||0)));
    return{list:out,hasCp:cp.length>0,hasCat:same.length>0};
  }
  function moreBox(i){
    const r=relList(i,10);if(!r.list.length)return '';
    const lbl=r.hasCp?'More like this':(r.hasCat?`More in ${E(i.category.trim())}`:'More like this');
    return `<div class="dmore"><div class="dmore-l">${lbl}</div><div class="dmore-g" id="dmore-grid">${r.list.map(x=>Browse.card(x)).join('')}</div></div>`;
  }
  /* Mark sold: sale record + quantity + stock number, same sync as the storefront (pending is consumed first) */
  async function markSold(){
    const i=get(id);if(!i||i.status==='ended')return;
    if(!await DB.ensure())return;
    Mx.form({title:'Mark sold',note:E(i.title||'')+'<br><span style="color:var(--t3)">Records the sale (price record), lowers quantity and removes the stock numbers. The last unit makes the listing OUT OF STOCK. Package it afterwards from this page.</span>',
      fields:[{k:'qty',label:'How many sold?',type:'number',min:1,value:1},{k:'skus',label:'Stock number(s) sold',value:((i.stock||0)<=1?(i.sku||''):''),ph:'stock #'},{k:'price',label:'Price each',type:'number',min:0,step:'0.01',value:(i.price||0).toFixed(2)},
        {k:'name',label:'Buyer name',value:''},{k:'company',label:'Company name',value:''},{k:'email',label:'Buyer email',type:'email',value:''},{k:'phone',label:'Buyer phone',type:'tel',value:''},{k:'zip',label:'Zip code',value:''}],ok:'✓ Mark sold',
      onOk:v=>{const q=parseInt(v.qty);if(!q||q<1){Toast('Enter how many');return false}const pr=parseFloat(v.price);
        const nb={name:v.name.trim(),company:v.company.trim(),email:v.email.trim(),phone:v.phone.trim(),zip:v.zip.trim()};
        Sx.nextOrder().then(order=>Sx.sell(i.id,{qty:q,skus:v.skus,price:isFinite(pr)?pr:undefined,src:'sold',order,buyer:Object.values(nb).some(Boolean)?nb:null})).then(r=>{
          if(r){Toast((r.item.oos?'Sold: listing is now OUT OF STOCK':'Sold: '+(r.item.stock||0)+' left')+' · PO '+r.item.sales[r.item.sales.length-1].order,4500);chrome();Browse.render();refresh()}})}});
  }

  async function markSold_old(){
    const i=get(id);if(!i)return;
    if(!await DB.ensure())return;
    const q=Math.max(1,parseInt(prompt(`Mark sold — quantity for ${i.sku||i.title}:`,'1'),10)||0);
    if(!q||q<1)return;
    const base=DB.ver(i);
    i.stock=Math.max(0,(i.stock||0)-q);
    i.soldQty=(i.soldQty||0)+q;
    i.updated=Date.now();
    await saveItems();
    let msg=`Sold ${q} × ${i.sku||''}`,fn=null;
    if(DB._hasDir()){ /* disk is source of truth — packet write + read-back verify + manifest autosave */
      const c=await DB.conflict(i.id,base);
      if(c){DB.conflictMsg(i.id,c);chrome();Browse.render();show(i,false);return}
      fn=await DB.write(i,i.status==='ended'?'ended':'active');
      if(fn){await DB.autoSave();msg+=' — '+fn}else msg='NOT saved to folder — re-link B64 and try again';
    }
    chrome();Browse.render();show(i,false);Toast(msg,fn?2600:4200);
  }
  async function endIt(){
    const i=get(id);if(!i)return;
    if(!await DB.ensure())return;
    if(!confirm(`End listing \u201c${i.title}\u201d?`))return;
    const base=DB.ver(i);
    i.status='ended';i.endReason='ended';i.ended=Date.now();i.updated=Date.now();i.pend=[];
    await saveItems();
    let msg='Listing ended',fn=null;
    if(DB._hasDir()){
      const c=await DB.conflict(i.id,base);
      if(c){DB.conflictMsg(i.id,c);chrome();Browse.render();show(i,false);return}
      fn=await DB.write(i,'ended');
      if(fn){await DB.autoSave();msg='Listing ended — '+fn}else msg='NOT saved to folder — re-link B64 and try again';
    }
    chrome();Browse.render();show(i,false);Toast(msg,fn?2600:4200);
  }
  async function delIt(){
    const i=get(id);if(!i)return;
    if(!await DB.ensure())return;
    if(!confirm(`Delete \u201c${i.title}\u201d permanently?`))return;
    const base=DB.ver(i);
    ITEMS=ITEMS.filter(x=>x.id!==i.id);
    await saveItems();
    let msg='Listing deleted',fn=null;
    if(DB._hasDir()){
      const c=await DB.conflict(i.id,base);
      if(c){DB.conflictMsg(i.id,c);chrome();close();Browse.render();return}
      fn=await DB.write({id:i.id,title:i.title||''},'deleted'); /* tombstone packet — other workstations see the deletion */
      if(fn){await DB.autoSave();msg='Listing deleted — '+fn}else msg='Delete NOT saved to folder — re-link B64 and try again';
    }
    chrome();close();Browse.render();Toast(msg,fn?2600:4200);
  }
  return{open,close,_closeView,toBrowse,refresh,markSold,endIt,delIt,togPB,cur:()=>id,current:()=>id!=null?get(id):null};
})();

<script>

const isPackaged=i=>!!(i&&(i.sales||[]).some(s=>s.pk||s.src==='package'));

const Mx=(()=>{

/* ═══ SALES / PENDING SOLD / OUT OF STOCK ═══

const Sx=(()=>{

  // flat price records for DB stats (ended listings without a recorded sale give no price records)
  function records(items){
    const out=[];
    (items||DS.all()).forEach(i=>{
      if(i.sales&&i.sales.length)i.sales.forEach(s=>out.push({ts:s.ts||0,price:+s.price||0,qty:s.qty||1,sku:(s.skus&&s.skus[0])||i.sku||''}));

  }
  // one safe write of a listing: vendor + folder linked + no newer version on disk; mut(copy) returns false to abort
  let _cq=Promise.resolve();
  function _commit(id,mut){const run=()=>_commit0(id,mut);const p=_cq.then(run,run);_cq=p.catch(()=>{});return p}
  async function _commit0(id,mut){
    if(!Vnd.on()){Toast('Vendor mode (local file) required');return null}
    if(!await DB.ensure())return null;
    const item=DS.get(id);if(!item){Toast('Listing not found');return null}
    if(item.status==='ended'){Toast('This listing is ended');return null}
    const c=await DB.conflict(id,DS.ver(item));if(c){DB.conflictMsg(id,c);return null}
    const u={...item,pend:(item.pend||[]).map(p=>({...p})),sales:(item.sales||[]).map(s=>({...s}))};
    const ic=DS.imgs(id);if(ic){u.images=ic.images;u.thumbs=ic.thumbs}
    const out={};const r=mut(u,out);if(r===false)return null;
    DS.save(u);
    if(!await DB.write(u,'active',{direct:true})){Toast('NOT saved to folder, re-link B64 and try again');return null}

  // the one place quantity / stock numbers / sale records change
  function _apply(u,o,out){
    const q=Math.max(1,parseInt(o.qty)||1),fl={qty:true,sku:false,weight:false,size:false};
    u.stock=Math.max(0,(u.stock||0)-q);
    const used=toks(o.skus);
    if(used.length){const set=new Set(used.map(x=>x.toLowerCase())),had=toks(u.sku),left=had.filter(t=>!set.has(t.toLowerCase()));fl.sku=left.length<had.length;u.sku=left.join(', ')}

  // 6-digit purchase order numbers (100001...), shared by pending orders, sales and package entries

  function allPending(){const out=[];DS.all().forEach(i=>{if(i.status==='ended')return;live(i).forEach(p=>out.push({it:i,p}))});return out.sort((x,y)=>y.p.ts-x.p.ts)}

  // packaging an item that was already marked sold: quantity / stock # were adjusted at sale time, so nothing is deducted again
  async function packSale(id,saleId,o){
    const r=await _commit(id,(u,out)=>{

/* ═══ PAYPAL PAY LINK / REQUEST (static page: no PayPal API secrets, so a request = pay link sent by email or text) ═══ */

const Pay=(()=>{
  function store(){const all=DS.all().filter(i=>i.status!=='ended').sort((a,b)=>(b.id||0)-(a.id||0));const nw=all[0];return{name:nw?.storeName||CFG.NAME||'My Store',phone:nw?.phone||CFG.PHONE||'',addr:nw?.addr||CFG.ADDRESS||''}}

    const p=new URLSearchParams({cmd:'_cart',upload:'1',business:CFG.PP_EMAIL||'',currency_code:CFG.PP_CUR});
    lines.forEach((b,i)=>{const n=i+1;p.set('item_name_'+n,b.title||'Item');p.set('item_number_'+n,String(b.sku||b.id||''));p.set('amount_'+n,(+b.price||0).toFixed(2));p.set('quantity_'+n,b.qty||1);p.set('shipping_'+n,(+b.ship||0).toFixed(2))});

  }

    const m=sums(lines);

      lines.map(b=>(b.qty||1)+' x '+(b.title||'Item')+(b.id?' (#'+b.id+(b.sku?', stock '+b.sku:'')+')':'')+'  $'+((+b.price||0)*(b.qty||1)).toFixed(2)).join('\n')+
      '\n\nShipping: $'+m.ship.toFixed(2)+'\nTotal: $'+m.tot.toFixed(2)+'\n\nPay securely with PayPal:\n'+link+'\n\n'+st.name+(st.phone?'\n'+st.phone:'')+(st.addr?'\n'+st.addr:'');
  }
  function _open(u){const a=document.createElement('a');a.href=u;a.rel='noopener';document.body.appendChild(a);a.click();a.remove()}
  // kind: 'mail' | 'sms' | 'copy'. Returns true when the request was handed off.
  async function send(kind,lines,buyer,order){
