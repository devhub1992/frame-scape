    if(!lines.length){Toast('Nothing to request');return false}
    const st=store(),link=url(lines),body=text(st,lines,link,order);
    if(kind==='copy'){try{await navigator.clipboard.writeText(body);Toast('Request + pay link copied')}catch(e){prompt('Copy this request:',body)}return true}
    if(kind==='mail'){
      const em=String(buyer.email||'').trim();if(!/^\S+@\S+\.\S+$/.test(em)){Toast('Enter a valid buyer email');return false}
      _open('mailto:'+em+'?subject='+encodeURIComponent('Payment request from '+st.name+(order?' - order #'+order:''))+'&body='+encodeURIComponent(body));return true;
    }
    if(kind==='sms'){
      const ph=String(buyer.phone||'').trim();if(ph.replace(/\D/g,'').length<7){Toast('Enter the buyer phone number');return false}
      const m=sums(lines);
      _open('sms:'+ph.replace(/[^\d+]/g,'')+'?&body='+encodeURIComponent(st.name+' payment request'+(order?' #'+order:'')+': $'+m.tot.toFixed(2)+'\n'+link));return true;
    }
    return false;
  }
  return{store,url,sums,text,send};
})();

const Rc=(()=>{
  const p2=n=>String(n).padStart(2,'0');
  function fname(d){d=d||new Date();return'receipt_'+p2(d.getMonth()+1)+p2(d.getDate())+d.getFullYear()+'_'+p2(d.getHours())+p2(d.getMinutes())+p2(d.getSeconds())+'.png'}
  function wrap(cx,t,w){
    t=String(t||'');const out=[];let ln='';
    for(const word of t.split(/(\s+)/)){
      if(cx.measureText(ln+word).width<=w){ln+=word;continue}
      if(ln.trim())out.push(ln.trim());ln='';
      if(cx.measureText(word).width<=w){ln=word.trimStart();continue}
      for(const ch of word){if(cx.measureText(ln+ch).width>w){out.push(ln);ln=ch}else ln+=ch}
    }
    if(ln.trim()||!out.length)out.push(ln.trim());return out;
  }
  function draw(o){
    const W=1000,pad=32,S=2,st=o.store||{},ln=o.lines||[],dt=o.date||new Date();
    const cQ=pad+10,cI=pad+66,cS=pad+150,cT=pad+318,pR=W-pad-112,sR=W-pad-10,tW=pR-98-cT,sW=cT-cS-14;
    const buyer=o.buyer||{};const bl=[['Name',buyer.name],['Company',buyer.company],['Email',buyer.email],['Phone',buyer.phone],['Zip',buyer.zip]].filter(r=>r[1]&&String(r[1]).trim());
    const m=Pay.sums(ln);
    function render(x,Hbg){
      x.fillStyle='#fff';x.fillRect(0,0,W,Hbg);x.textBaseline='alphabetic';x.textAlign='left';
      let y=pad+22;
      x.fillStyle='#111';x.font='bold 24px Arial';
      let nm=String(st.name||'Store');while(nm.length>1&&x.measureText(nm).width>W-2*pad-260)nm=nm.slice(0,-1);
      x.fillText(nm,pad,y);
      x.textAlign='right';x.fillStyle='#444';x.font='bold 13px Arial';
      if(o.order)x.fillText('ORDER #'+o.order,W-pad,y-8);
      x.fillStyle='#999';x.font='11px Arial';x.fillText(dt.toLocaleDateString()+' '+dt.toLocaleTimeString(),W-pad,y+8);x.textAlign='left';
      x.fillStyle='#555';x.font='12px Arial';
      if(st.phone){y+=20;x.fillText('Phone: '+st.phone,pad,y)}
      if(st.addr){y+=18;x.fillText('Address: '+st.addr,pad,y)}
      y+=24;
      x.fillStyle='#f0f0f0';x.fillRect(pad,y,W-2*pad,28);x.strokeStyle='#ccc';x.lineWidth=1;x.strokeRect(pad+.5,y+.5,W-2*pad-1,27);
      x.fillStyle='#333';x.font='bold 11px Arial';const hy=y+18;
      x.fillText('QTY',cQ,hy);x.fillText('ITEM ID',cI,hy);x.fillText('STOCK #',cS,hy);x.fillText('TITLE',cT,hy);
      x.textAlign='right';x.fillText('PRICE',pR,hy);x.fillText('SHIP',sR,hy);x.textAlign='left';
      y+=28;
      ln.forEach(b=>{
        x.font='13px Arial';const tl=wrap(x,b.title||'',tW);
        x.font='12px monospace';const sl=wrap(x,b.sku||'',sW);
        const n=Math.max(tl.length,sl.length,1),h=n*17+12;
        x.strokeStyle='#ccc';x.strokeRect(pad+.5,y+.5,W-2*pad-1,h);
        x.fillStyle='#111';x.font='13px Arial';x.fillText(String(b.qty||1),cQ,y+19);
        x.font='12px monospace';x.fillText(b.id!=null&&b.id!==''?'#'+b.id:'',cI,y+19);
        sl.forEach((t,i)=>x.fillText(t,cS,y+19+i*17));
        x.font='13px Arial';tl.forEach((t,i)=>x.fillText(t,cT,y+19+i*17));
        x.textAlign='right';x.fillText('$'+((+b.price||0)*(b.qty||1)).toFixed(2),pR,y+19);x.fillText('$'+(+b.ship||0).toFixed(2),sR,y+19);x.textAlign='left';
        y+=h;
      });
      y+=22;const sx=W-pad-270;
      x.font='13px Arial';x.fillStyle='#111';
      x.fillText('Items',sx,y);x.textAlign='right';x.fillText('$'+m.sub.toFixed(2),W-pad,y);x.textAlign='left';y+=20;
      x.fillText('Shipping',sx,y);x.textAlign='right';x.fillText('$'+m.ship.toFixed(2),W-pad,y);x.textAlign='left';y+=10;
      x.fillStyle='#111';x.fillRect(sx,y,270,2);y+=23;
      x.font='bold 17px Arial';x.fillText('Total',sx,y);x.textAlign='right';x.fillText('$'+m.tot.toFixed(2),W-pad,y);x.textAlign='left';
      if(bl.length){
        y+=26;x.setLineDash([4,3]);x.strokeStyle='#aaa';x.beginPath();x.moveTo(pad,y);x.lineTo(W-pad,y);x.stroke();x.setLineDash([]);
        y+=20;x.fillStyle='#777';x.font='bold 10px Arial';x.fillText('BUYER',pad,y);
        x.font='13px Arial';x.fillStyle='#111';
        bl.forEach((r,i)=>{const col=i%2,row=Math.floor(i/2);x.fillText(r[0]+': '+r[1],pad+col*(W/2-pad),y+20+row*20)});
        y+=20+Math.ceil(bl.length/2)*20-8;
      }
      y+=34;x.fillStyle='#999';x.font='11px Arial';x.textAlign='center';x.fillText('Thank you for your business',W/2,y);x.textAlign='left';
      return y+pad;
    }
    const sc=document.createElement('canvas');sc.width=1;sc.height=1;
    const H=Math.ceil(render(sc.getContext('2d'),1));
    const c=document.createElement('canvas');c.width=W*S;c.height=H*S;const x=c.getContext('2d');x.scale(S,S);render(x,H);
    return c;
  }
  function show(c,name){
    const url=c.toDataURL('image/png');
    const old=$('bkimgmod');if(old)old.remove();
    const d=document.createElement('div');d.id='bkimgmod';
    d.innerHTML=`<img src="${url}" alt="Receipt"><div style="display:flex;gap:8px"><a class="pill" href="${url}" download="${E(name)}" style="text-decoration:none;display:inline-flex;align-items:center">⬇ Download ${E(name)}</a><button type="button" class="pill" id="bkimgx">✕ Close</button></div>`;
    d.onclick=e=>{if(e.target===d||e.target.id==='bkimgx')d.remove()};
    document.body.appendChild(d);
  }
  function png(o){const c=draw(o);show(c,fname(o.date||new Date()))}
  return{fname,draw,show,png};
})();

const Pk=(()=>{
  const FN='packages.b64';
  let ents=[],shown=40,fq='',fd='',selId=null;
  const p2=n=>String(n).padStart(2,'0');
  const fDate=ts=>new Date(ts).toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric',year:'numeric'}).replace(',','.');
  const fTime=ts=>new Date(ts).toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'});
  const dayKey=ts=>{const a=new Date(ts);return a.getFullYear()+'-'+p2(a.getMonth()+1)+'-'+p2(a.getDate())};
  const isNoStock=v=>/^no\s*stock$/i.test(String(v||'').trim());
  function normDims(v){const m=String(v||'').trim().match(/^(\d+(?:\.\d+)?)\s*[xX×]\s*(\d+(?:\.\d+)?)\s*[xX×]\s*(\d+(?:\.\d+)?)$/);return m?m[1]+'x'+m[2]+'x'+m[3]:null}
  /* ── file I/O (merge by entry id, newest wins, so several workstations never lose each other's entries) ── */
  async function _read(){
    const d=DB.dir();if(!d)return null;
    try{const fh=await d.getFileHandle(FN);const o=Pkt.dec(await(await fh.getFile()).text());return o&&Array.isArray(o.packages)?o.packages:[]}
    catch(e){return e&&e.name==='NotFoundError'?[]:null}
  }
  function _merge(a,b){const m=new Map();[...a,...b].forEach(e=>{if(!e||!e.id)return;const c=m.get(e.id);if(!c||(e.u||0)>=(c.u||0))m.set(e.id,e)});return[...m.values()]}
  async function load(){const d=await _read();if(d===null)return false;ents=_merge(ents,d);return true}
  async function _save(){
    if(!await DB.ready()){Toast('Link the B64 folder first');return false}
    const disk=await _read();ents=_merge(ents,disk||[]);
    try{const fh=await DB.dir().getFileHandle(FN,{create:true});const w=await fh.createWritable();await w.write(Pkt.enc({v:1,ts:Date.now(),packages:ents}));await w.close();return true}
    catch(e){Toast('packages.b64 write failed: '+e.message);return false}
  }
  const maxOrder=()=>Math.max(100000,...ents.map(x=>x.order||0));
  async function _add(e){
    await load();const now=Date.now();
    const full={id:'pk'+now.toString(36)+Math.random().toString(36).slice(2,5),order:e.order||await Sx.nextOrder(),ts:now,u:now,done:false,del:false,qty:1,...e};

      ${pend.length?`<div class="pkf-pend"><div class="pkf-pt">⏳ Pending orders on this listing (newest first). Click one to fulfil it as this package</div>${pend.map(p=>`<div class="pkf-po" data-p="${p.id}"><b>${p.qty} x</b> ${E((p.skus||[]).join(', '))||'<i>no stock #</i>'}<span class="pkf-pb">${E(buyerTxt(p.buyer))||'<i>no buyer info</i>'}</span><span class="pkf-pd">${days(p.ts)}d pending${p.order?' · PO '+p.order:''}</span><button type="button" class="pkf-ed" data-e="${p.id}" title="Edit buyer info">✎</button></div>`).join('')}</div>`:''}
      <div class="pkf-row">
        <div class="pkf-f"><label>Stock number *</label><input id="pkf-sku" class="pkf-req" type="text" autocomplete="off" placeholder="${E(gSku||'click and type (double-click = No Stock)')}" data-g="${E(gSku)}"></div>
        <div class="pkf-f"><label>Weight (lbs) *</label><input id="pkf-wt" class="pkf-req" type="text" autocomplete="off" placeholder="${E(gWt||'enter weight')}" data-g="${E(gWt)}"></div>
      </div>
      <div class="pkf-hint">Click the two green-outlined fields to confirm them (a faded value is filled in from the listing). No stock number on the listing? Click and type it, or double-click the field to set No Stock.</div>
      <div class="pkf-row">

        <div class="pkf-f"><label>Initials</label><input id="pkf-ini" type="text" maxlength="2" autocomplete="off" placeholder="${E(gIni||'AB')}" style="text-transform:uppercase"></div>
        <div class="pkf-f"><label>Quantity</label><input id="pkf-qty" type="number" min="1" placeholder="1"></div>
        <div class="pkf-f"><label>Price</label><input id="pkf-price" type="number" min="0" step="0.01" value="${(it.price||0).toFixed(2)}"></div>
        <div class="pkf-f"><label>Shipping</label><input id="pkf-ship" type="number" min="0" step="0.01" value="${(+it.shipping||0).toFixed(2)}"></div>

      <div class="pkf-b"><button type="button" class="pill on" id="pkf-ok" disabled>✓ Submit package</button><button type="button" class="pill" id="pkf-cx">Cancel</button></div>

    document.body.appendChild(d);

      el.addEventListener('focus',touch);el.addEventListener('click',touch);el.addEventListener('input',mark);
    });
    $('pkf-sku').addEventListener('dblclick',()=>{const el=$('pkf-sku');el.value='No Stock';el.classList.add('ok');chk()});
    $('pkf-ini').addEventListener('input',e=>{e.target.value=e.target.value.replace(/[^a-zA-Z]/g,'').toUpperCase().slice(0,2)});

    d.querySelectorAll('.pkf-po').forEach(r=>r.addEventListener('click',ev=>{
      const eb=ev.target.closest('.pkf-ed');
      if(eb){ev.stopPropagation();Sx.editBuyerUI(it.id,eb.dataset.e,()=>{d.remove();_form(DS.get(it.id))});return}

  async function _submit(id,o){

  function _ensureDom(){

        <button type="button" class="pill" id="pk-cls">✕</button></div>

        <div id="pk-tbl"><table class="pk-t"><thead><tr><th title="Press after the shipping label is made">Done<small>after label</small></th><th>Date</th><th>Time</th><th>Title</th><th>Weight</th><th>Size</th><th>Init</th><th>Stock</th><th class="n">Qty</th><th class="n">Price</th><th class="n">Ship</th><th>ID</th><th title="Order number (click a PO to show it)">PO</th><th></th></tr></thead><tbody id="pk-body"></tbody></table><div id="pk-more"></div></div></div>
      <div id="pk-foot"><span class="pk-fl">Item life cycle (data trail, keeps the item id):</span>${STEPS.map((x,i)=>`<span class="pk-step" tabindex="0" data-t="${E(x[1])}">${E(x[0])}</span>${i<STEPS.length-1?'<span class="pk-arr">→</span>':''}`).join('')}<span class="pk-fn">Press ✓ Done after the shipping label is made.</span></div>

  function _parse(q){

      <div class="pu-sec">Customer information</div>

        <div class="pkf-f"><label>Name</label><input id="pu-n" type="text" autocomplete="off" value="${E(cust.name)}"></div>
        <div class="pkf-f"><label>Business name</label><input id="pu-c" type="text" autocomplete="off" value="${E(cust.company)}"></div>
        <div class="pkf-f"><label>Phone number</label><input id="pu-p" type="tel" autocomplete="off" value="${E(cust.phone)}"></div>
        <div class="pkf-f"><label>Email</label><input id="pu-e" type="email" autocomplete="off" value="${E(cust.email)}"></div>
      </div>
      ${cur?`<div class="pu-sec">Add this listing: #${cur.id} ${E(cur.title||'')}</div>
      <div class="pkf-row">
        <div class="pkf-f"><label>Stock number *</label><input id="pu-sku" class="pkf-req" type="text" autocomplete="off" placeholder="${E(g||'click and type (double-click = No Stock)')}" data-g="${E(g)}"></div>
        <div class="pkf-f"><label>Quantity (${cur.stock||0} in stock)</label><input id="pu-qty" type="number" min="1" placeholder="1"></div>
        <div class="pkf-f"><label>Price</label><input id="pu-price" type="number" min="0" step="0.01" value="${(cur.price||0).toFixed(2)}"></div>
        <div class="pkf-f" style="flex:none;align-self:flex-end"><button type="button" class="pill on" id="pu-add" style="height:38px;padding:0 16px">＋ Add to pickup</button></div>
      </div>`:'<div class="pkf-hint">To add an item, open its listing and press Pickup. Ended or out of stock listings cannot be added.</div>'}
      <div class="pu-sec">Pickup items</div><div id="pu-lines"></div>
      <div class="pkf-b"><button type="button" class="pill on" id="pu-print">🖨 Print receipt &amp; complete pickup</button><button type="button" class="pill" id="pu-more">＋ Browse more listings</button><button type="button" class="pill" id="pu-clr">🗑 Clear pickup</button></div>
      <div class="pu-foot">Once the receipt is printed, the items are passed to the top of the Packages list (highlighted as PKP pickup entries, no size or weight) and their quantities and stock numbers are adjusted automatically. The receipt includes the customer information, purchase order number, item ids and stock numbers. Browse other listings and press Pickup again to add more items; Clear removes the whole pickup without changing any listing.</div>
    </div>`;
    document.body.appendChild(m);_lines();badge();
    const close=()=>m.remove();
    $('pu-x').onclick=close;$('pu-more').onclick=close;
    m.addEventListener('keydown',e=>{if(e.key==='Escape')close()});
    m.addEventListener('click',e=>{if(e.target===m)close()});
    [['pu-n','name'],['pu-c','company'],['pu-p','phone'],['pu-e','email']].forEach(([id,k])=>$(id).addEventListener('input',e=>{cust[k]=e.target.value;save()}));
    if(cur){
      const sk=$('pu-sku');
      const mark=()=>sk.classList.toggle('ok',!!sk.value.trim());
      const touch=()=>{if(!sk.value.trim()&&sk.dataset.g)sk.value=sk.dataset.g;mark()};
      sk.addEventListener('focus',touch);sk.addEventListener('click',touch);sk.addEventListener('input',mark);
      sk.addEventListener('dblclick',()=>{sk.value='No Stock';mark()});
      $('pu-add').onclick=()=>{
        let sku=sk.value.trim();if(!sku){Toast('Stock number required (double-click the field for No Stock)');sk.focus();return}
        if(isNoStock(sku))sku='No Stock';
        const q=Math.max(1,parseInt($('pu-qty').value)||1),pr=parseFloat($('pu-price').value);
        if(!isFinite(pr)||pr<0){Toast('Enter a price');return}
        if(q+inCart(cur.id)>(cur.stock||0)){Toast('Only '+(cur.stock||0)+' in stock (already '+inCart(cur.id)+' in this pickup)');return}
        lines.push({id:cur.id,title:cur.title||'',sku,qty:q,price:pr});save();_lines();badge();
        sk.value='';sk.classList.remove('ok');$('pu-qty').value='';Toast('Added to pickup ('+lines.length+')');
      };
    }
    $('pu-lines').addEventListener('click',e=>{const r=e.target.closest('[data-r]');if(r){lines.splice(+r.dataset.r,1);save();_lines();badge()}});
    $('pu-lines').addEventListener('change',e=>{const q=e.target.closest('[data-q]');if(q){const l=lines[+q.dataset.q];const n=parseInt(q.value);l.qty=n>=1?n:1;save();_lines()}});
    $('pu-clr').onclick=()=>{if(!lines.length&&!Object.values(cust).some(Boolean)){Toast('Pickup is already empty');return}if(!confirm('Clear the whole pickup (items and customer information)? Listings are not changed.'))return;clear();open()};
    $('pu-print').onclick=complete;
  }
  function clear(){lines=[];cust={name:'',company:'',phone:'',email:''};save();badge()}
  function _receiptHtml(done,order,ts){
    const st=Pay.store(),d=new Date(ts),c=cust;
    const cl=[['Name',c.name],['Business',c.company],['Phone',c.phone],['Email',c.email]].filter(r=>String(r[1]||'').trim());
    return`<!DOCTYPE html><html><head><title>Pickup receipt PO ${order}</title><style>body{font-family:Arial,sans-serif;font-size:11pt;margin:20px;color:#111}h1{font-size:17pt;margin:0 0 3px}.m{color:#555;font-size:10pt;margin:1px 0}.r{float:right;text-align:right;font-size:10.5pt}table{width:100%;border-collapse:collapse;margin-top:14px;clear:both}th,td{border:1px solid #bbb;padding:5px 7px;text-align:left;vertical-align:top;font-size:10.5pt}th{background:#eee}.n{text-align:right;white-space:nowrap}.c{margin-top:12px;border:1px solid #bbb;padding:8px 10px;font-size:10.5pt}.c b{display:inline-block;min-width:70px}.t{margin-top:10px;text-align:right;font-size:13pt;font-weight:bold}.sig{margin-top:34px;font-size:10pt;color:#555}@media print{body{margin:8mm}}</style></head><body>
<div class="r"><b>PICKUP RECEIPT</b><br>Purchase order <b>${order}</b><br>${E(d.toLocaleDateString())} ${E(d.toLocaleTimeString())}</div>
<h1>${E(st.name)}</h1>${st.phone?`<div class="m">${E(st.phone)}</div>`:''}${st.addr?`<div class="m">${E(st.addr)}</div>`:''}
<div class="c"><div style="font-size:9pt;color:#777;margin-bottom:4px">CUSTOMER</div>${cl.length?cl.map(r=>`<div><b>${r[0]}:</b> ${E(r[1])}</div>`).join(''):'<i>no customer information entered</i>'}</div>
<table><thead><tr><th class="n">Qty</th><th>ID</th><th>Stock #</th><th>Title</th><th class="n">Price</th></tr></thead><tbody>${done.map(l=>`<tr><td class="n">${l.qty||1}</td><td>#${l.id}</td><td>${E(l.sku||'')}</td><td>${E(l.title||'')}</td><td class="n">${money((+l.price||0)*(l.qty||1))}</td></tr>`).join('')}</tbody></table>
<div class="t">Total ${money(tot(done))}</div><div class="sig">Picked up by: ____________________________ &nbsp; Date: ______________</div>
<script>window.onload=function(){window.print()}<\/script></body></html>`;
  }
  async function complete(){
    if(!lines.length){Toast('Add at least one item');return}
    if(!Object.values(cust).some(v=>String(v).trim())&&!confirm('No customer information entered. Print the receipt anyway?'))return;
    if(!confirm('Print the receipt and complete this pickup?\nQuantities and stock numbers are adjusted and the items are added to the Packages list with initials PKP.'))return;
    const w=window.open('','_blank','width=850,height=760');     // opened inside the click so the browser allows it
    if(!w){Toast('Allow pop-ups to print the receipt');return}
    w.document.write('<p style="font-family:Arial;padding:20px">Preparing receipt…</p>');
    const b=$('pu-print');if(b)b.disabled=true;
    await Pk.load();const order=await Sx.nextOrder(),ts=Date.now();
    const buyer={name:cust.name.trim(),company:cust.company.trim(),phone:cust.phone.trim(),email:cust.email.trim()},hasB=Object.values(buyer).some(Boolean);
    const done=[],fail=[];
    for(const l of lines){
      const it=DS.get(l.id);if(!it||it.status==='ended'){fail.push(l);continue}
      const r=await Sx.sell(l.id,{qty:l.qty||1,skus:isNoStock(l.sku)?'':l.sku,price:l.price,ts,src:'pickup',order,buyer:hasB?buyer:null});
      if(!r){fail.push(l);continue}
      await Pk._add({order,itemId:l.id,title:l.title,sku:l.sku,weight:'',dims:'',init:'PKP',qty:l.qty||1,price:+l.price||0,ts,buyer:hasB?{...buyer}:null,pickup:true,
        ship:0,saleId:(r.item.sales&&r.item.sales.length?r.item.sales[r.item.sales.length-1].id:undefined),log:{packaged:true,weight:false,size:false,sku:r.fl.sku,qty:true,price:true,ship:false,status:r.fl.status}});
      done.push(l);
    }
    if(!done.length){try{w.close()}catch(e){}if(b)b.disabled=false;Toast('Nothing could be completed');return}
    w.document.open();w.document.write(_receiptHtml(done,order,ts));w.document.close();
    lines=fail;if(!fail.length)cust={name:'',company:'',phone:'',email:''};save();badge();
    $('pumod')?.remove();
    Toast('Pickup complete, PO '+order+' · '+done.length+' item'+(done.length>1?'s':'')+' added to Packages (PKP)'+(fail.length?' · '+fail.length+' could not be completed and stay in the pickup':''),6000);
    try{Det.refresh()}catch(e){}
    if($('pkmod')?.classList.contains('on')){try{Pk.refresh()}catch(e){}}
  }
  return{open,clear,badge,complete};
})();

</script>
<script>
'use strict';
/* ═══ BASKET — #bklist pattern §10 (qty steppers · totals · PayPal cart §10 modal.paypal) ═══ */
const Basket=(()=>{
  let L=LS.load(LS.KB)||{};
  if(typeof L!=='object'||Array.isArray(L))L={};
  const save=()=>LS.save(LS.KB,L);
  function lines(){return Object.entries(L).map(([id,qty])=>({i:get(id),qty})).filter(x=>x.i&&x.i.status!=='ended')}
  const count=()=>lines().reduce((s,x)=>s+x.qty,0);
  function add(id){const i=get(id);if(!i)return;L[id]=(L[id]||0)+1;save();render();Toast('Added to basket — '+(i.sku||i.title))}
  function setQty(id,v){v=Math.max(0,Math.min(99,parseInt(v,10)||0));if(!v)delete L[id];else L[id]=v;save();render()}
  function dec(id){setQty(id,(L[id]||1)-1)}
  function inc(id){setQty(id,(L[id]||0)+1)}
  function rm(id){delete L[id];save();render()}
  function clear(){L={};save();render()}
  function render(){
    const ls=lines(),n=ls.reduce((s,x)=>s+x.qty,0),b=$('baskn');
    b.textContent=n>0?n:'';
    $('bk-count').textContent=n;
    const el=$('bklist');
    if(!ls.length)el.innerHTML='<div class="bkempty">Basket is empty — open a listing and add it.</div>';
    else el.innerHTML=ls.map(({i,qty})=>{
      const line=(i.price||0)*qty;
      return `<div class="bkrow">
        <div class="bkinfo"><div class="bkt">${E(i.title)}</div>
        <div class="bks">${E(i.sku||'')}${(i.shipping||0)>0?' · +'+money(i.shipping)+' ship each':''}</div></div>
        <div class="bkqty">
          <button class="bkqb" onclick="Basket.dec(${i.id})" aria-label="less">−</button>
          <input class="bkq" type="text" inputmode="numeric" value="${qty}" oninput="Basket.setQty(${i.id},this.value)" aria-label="qty">
          <button class="bkqb" onclick="Basket.inc(${i.id})" aria-label="more">+</button>
        </div>
        <div class="bkp">${money(line)}</div>
        <button class="bkrm" onclick="Basket.rm(${i.id})" title="Remove"><i class="fa-solid fa-xmark"></i></button>
      </div>`}).join('');
    const sub=ls.reduce((s,x)=>s+(x.i.price||0)*x.qty,0);
    const ship=ls.reduce((s,x)=>s+(x.i.shipping||0)*x.qty,0);
    $('bk-sub').textContent=money(sub);
    $('bk-ship').textContent=money(ship);
    $('bk-tot').textContent=money(sub+ship);
  }
  let _skipPop=false;
  const isOpen=()=>$('bkmod').classList.contains('onm');
  function open(){render();if(isOpen())return;$('bkmod').classList.add('onm');
    try{history.pushState(Object.assign({},history.state||{},{bk:1}),'')}catch(e){}} /* Back closes the basket */
  function close(fromPop){if(!isOpen())return;$('bkmod').classList.remove('onm');
    if(fromPop!==true&&history.state&&history.state.bk){_skipPop=true;try{history.back()}catch(e){_skipPop=false}}}
  function popGuard(){if(_skipPop){_skipPop=false;return true}if(isOpen()){close(true);return true}return false}
  function checkout(){
    const ls=lines();
    if(!ls.length){Toast('Basket is empty');return}
    if(!CFG.PP_EMAIL){Toast('No PayPal address — set it in Business Info (vendor mode)',3600);return}
    const f=$('ppform');f.innerHTML='';
    const add=(k,v)=>{const h=document.createElement('input');h.type='hidden';h.name=k;h.value=v;f.appendChild(h)};
    add('cmd','_cart');add('upload','1');add('business',CFG.PP_EMAIL);add('currency_code',CFG.PP_CUR);
    ls.forEach((x,n)=>{const m=n+1;
      add('item_name_'+m,x.i.title);add('item_number_'+m,x.i.sku||x.i.id);
      add('amount_'+m,(x.i.price||0).toFixed(2));add('quantity_'+m,x.qty);
      add('shipping_'+m,(x.i.shipping||0).toFixed(2))});
    Toast('Opening PayPal checkout…');
    setTimeout(()=>f.submit(),60);
  }
  return{add,dec,inc,setQty,rm,clear,render,open,close,isOpen,popGuard,checkout};
})();

/* vendbar visibility: always on in vendor mode; customers see it only while a listing is open (back button) */
function barSync(){
  const det=$('view-detail').classList.contains('on');
  const bar=$('vendbar');if(bar)bar.classList.toggle('on',Vnd.on()||det);
  const bb=$('vbback');if(bb)bb.style.display=det?'inline-flex':'none';
}
/* ═══ VENDOR — passcode gate §10 modal.vendor-auth · PIN = CFG.PASS §29 or changed via Business Info ═══ */
const Vnd={
  on(){try{return sessionStorage.getItem('bs_vend')==='1'}catch{return false}},
  gate(){$('vmod').classList.add('onm');setTimeout(()=>{if($('vmod').classList.contains('onm')&&!$('vmod').contains(document.activeElement))$('vpin').focus()},40)},
  closeGate(){$('vmod').classList.remove('onm');$('vpin').value=''},
  async checkPw(pin){ /* honors a password changed in Business Info (salted hash in latest.b64) */
    pin=String(pin==null?'':pin);
    if(CFG.PASS_HASH)return (await hashPw(pin,CFG.PASS_SALT||''))===CFG.PASS_HASH;
    return pin===CFG.PASS;
  },
  async login(){
    if(await this.checkPw($('vpin').value)){
      try{sessionStorage.setItem('bs_vend','1')}catch(e){}
      this.closeGate();this.apply();Browse.render();Toast('Vendor mode on — you see ended & out-of-stock too');
    }else{Toast('Wrong PIN');$('vpin').value='';$('vpin').focus()}
  },
  logout(){try{sessionStorage.removeItem('bs_vend')}catch(e){}this.apply();Browse.render();Toast('Vendor mode off')},
  apply(){
    document.body.classList.toggle('vend',this.on());
    barSync(); /* bar on for vendor mode AND for customers while a listing is open */
    try{RefreshGuard.sync()}catch(e){} /* guard armed only while vendor + B64 linked (configs §20) */
    try{DB.foot()}catch(e){}
    const cid=Det.cur();
    this.detBar(cid?get(cid):null);
  },
  detBar(i){ /* detail-context buttons — same bar as New/Export/B64, cleared when no listing is open */
    const el=$('vbdet');if(!el)return;
    if(!this.on()||!i){el.innerHTML='';return}
    const ended=i.status==='ended';
    el.innerHTML=
      `<button class="vb am" onclick="Ed.open(${i.id})" title="Edit this listing"><i class="fa-solid fa-pen-to-square"></i> Edit</button>`+
      (ended?'':`<button class="vb" onclick="Sx.markPendingUI(${i.id})" title="Pending sold (expires after 14 days)"><i class="fa-solid fa-hourglass-half"></i> Pending Sold</button>`)+
      (ended?'':`<button class="vb gn" onclick="Det.markSold()" title="Record a sale: lowers quantity, removes the stock number"><i class="fa-solid fa-dollar-sign"></i> Mark Sold</button>`)+
      (ended?'':`<button class="vb" onclick="Pk.packaged()" title="Package this item (weight, size, stock number, price, shipping)"><i class="fa-solid fa-box"></i> Packaged</button>`)+
      (ended?'':`<button class="vb" onclick="Sx.stockUI(${i.id})" title="Adjust quantity and stock numbers"><i class="fa-solid fa-boxes-stacked"></i> Stock</button>`)+
      (ended?'':`<button class="vb" onclick="Sx.locUI(${i.id})" title="Adjust bin location"><i class="fa-solid fa-location-dot"></i> Loc</button>`)+
      (ended?'':`<button class="vb" id="ab-pu" onclick="Pu.open()" title="Pickup order: customer picks items up in person"><i class="fa-solid fa-store"></i> Pickup</button>`)+
      (ended?'':`<button class="vb" onclick="Det.endIt()" title="End this listing"><i class="fa-solid fa-circle-stop"></i> End</button>`)+
      `<button class="vb rd" onclick="Det.delIt()" title="Delete this listing"><i class="fa-solid fa-trash-can"></i> Delete</button>`;
    try{Pu.badge()}catch(e){}
  },
  exportJSON(){
    const blob=new Blob([JSON.stringify(ITEMS,null,2)],{type:'application/json'});
    const a=document.createElement('a');
    a.href=URL.createObjectURL(blob);a.download=slug+'_export_'+Date.now()+'.json';a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href),500);
    Toast('Exported '+ITEMS.length+' listings');
  }
};

/* ═══ BUSINESS INFO — store identity persisted to latest.b64 (storefront Pay.store() pattern) ═══
   The header title, window title, OG tags, JSON-LD and the vendbar back button all follow the
   business name; the PayPal address feeds checkout; the vendor password is stored as a salted
   hash (same scheme as the old storefront's export password). Without a linked folder the info
   is cached in localStorage and written to latest.b64 the moment B64 is linked. */
const Biz=(()=>{
  const LSK='bs_biz_v1';
  const DEF={name:STORE_NAME,pp:PAYPAL_EMAIL,phone:'',addr:'',hours:'',spec:'',policy:'',
    returns:CFG.RETURNS,handling:CFG.HANDLING,svc:CFG.SVC,eta:CFG.ETA,passHash:'',passSalt:''};
  let D=Object.assign({},DEF);
  try{const s=LS.load(LSK);if(s&&typeof s==='object')D=Object.assign({},DEF,s)}catch(e){}
  const slugOf=n=>String(n||'').toLowerCase().replace(/[^a-z0-9]+/g,'')||'store';
  function manifestData(){
    return{name:D.name||STORE_NAME,pp:D.pp||'',phone:D.phone||'',addr:D.addr||'',hours:D.hours||'',
      spec:D.spec||'',policy:D.policy||'',returns:D.returns||DEF.returns,handling:D.handling||DEF.handling,
      svc:D.svc||DEF.svc,eta:D.eta||DEF.eta,passHash:D.passHash||'',passSalt:D.passSalt||''};
  }
  function paint(){ /* push the business name everywhere it is displayed */
    const nm=D.name||STORE_NAME;slug=slugOf(nm);
    const detOn=$('view-detail').classList.contains('on');
    if(!detOn){
      document.title=winTitle();
      const t=document.getElementsByTagName('title')[0];if(t)t.textContent=nm+' — storefront';
      const og=$('og-t');if(og)og.setAttribute('content',nm+' — storefront');
    }
    const tt=$('tt');if(tt)tt.innerHTML=`${E(nm)} — storefront <span id="tt-vend">/ vendor</span>`;
    const bn=$('vbbn');if(bn)bn.textContent=slug;
    const lg=document.querySelector('.mw-logo');if(lg)lg.title=nm+' home — back to the main page, clears search, brand and sort';
    const mw=document.querySelector('.mockwin');if(mw)mw.setAttribute('aria-label',nm+' storefront');
    try{const ld=$('ld-store');if(ld){const o=JSON.parse(ld.textContent||'{}');o.name=nm;ld.textContent=JSON.stringify(o)}}catch(e){}
    if(detOn){const i=Det.cur()&&get(Det.cur());if(i)Det.show(i,false)} /* detail partline picks up new returns/handling/service */
  }
  function apply(){ /* D → CFG + localStorage cache + paint */
    CFG.NAME=D.name||STORE_NAME;CFG.PP_EMAIL=D.pp||'';CFG.PHONE=D.phone||'';CFG.ADDRESS=D.addr||'';CFG.STORE_POLICY=D.policy||'';
    CFG.RETURNS=D.returns||DEF.returns;CFG.HANDLING=D.handling||DEF.handling;
    CFG.SVC=D.svc||DEF.svc;CFG.ETA=D.eta||DEF.eta;
    CFG.PASS_HASH=D.passHash||'';CFG.PASS_SALT=D.passSalt||'';
    try{localStorage.setItem(LSK,JSON.stringify(D))}catch(e){}
    paint();
  }
  function open(){
    if(!Vnd.on())return;
    $('bi-name').value=D.name||'';$('bi-pp').value=D.pp||'';
    $('bi-phone').value=D.phone||'';$('bi-addr').value=D.addr||'';
    $('bi-hours').value=D.hours||'';$('bi-spec').value=D.spec||'';$('bi-policy').value=D.policy||'';
    $('bi-returns').value=D.returns||DEF.returns;$('bi-handling').value=D.handling||DEF.handling;
    $('bi-svc').value=D.svc||DEF.svc;$('bi-eta').value=D.eta||DEF.eta;
    $('bi-pw1').value='';$('bi-pw2').value='';
    $('bimod').classList.add('onm');setTimeout(()=>{if($('bimod').classList.contains('onm')&&!$('bimod').contains(document.activeElement))$('bi-name').focus()},40);
  }
  function close(){$('bimod').classList.remove('onm')}
  async function save(){
    const name=$('bi-name').value.trim();
    if(!name){Toast('Business name is required');$('bi-name').focus();return}
    const pp=$('bi-pp').value.trim();
    if(pp&&!/^\S+@\S+\.\S+$/.test(pp)){Toast('Enter a valid PayPal email');$('bi-pp').focus();return}
    const p1=$('bi-pw1').value,p2=$('bi-pw2').value;
    if(p1||p2){
      if(p1!==p2){Toast('New passwords do not match');$('bi-pw2').value='';$('bi-pw2').focus();return}
      if(p1.length<4){Toast('Password must be at least 4 characters');$('bi-pw1').focus();return}
    }
    D.name=name;D.pp=pp;
    D.phone=$('bi-phone').value.trim();D.addr=$('bi-addr').value.trim();
    D.hours=$('bi-hours').value.trim();D.spec=$('bi-spec').value.trim();D.policy=$('bi-policy').value.trim();
    D.returns=$('bi-returns').value.trim()||DEF.returns;D.handling=$('bi-handling').value.trim()||DEF.handling;
    D.svc=$('bi-svc').value.trim()||DEF.svc;D.eta=$('bi-eta').value.trim()||DEF.eta;
    let pwMsg='';
    if(p1){ /* salted hash only — the PIN itself never goes to disk */
      let salt='';try{salt=[...crypto.getRandomValues(new Uint8Array(8))].map(b=>b.toString(16).padStart(2,'0')).join('')}catch(e){salt=Math.random().toString(16).slice(2,18)}
      D.passSalt=salt;D.passHash=await hashPw(p1,salt);pwMsg=' · vendor password updated';
    }
    close();apply();
    if(DB._hasDir()){ /* disk truth — rewrite latest.b64 right away */
      const kb=await DB.genManifest();

/* ═══ B64 DATABASE — ported from storefront.txt (FS · Pkt · Reg · DB) per configs §12 db.* ═══
   Disk is the source of truth: every listing lives as {id}_{title}.b64 (base64 JSON packet,
   payload {v:9,ts,store,status,id,item,files}) + latest.b64 manifest rewritten on every change.
   The folder handle is remembered in IndexedDB → session persists across reloads; the B64
   button relinks on click with a single permission prompt (no re-picking the folder). */
const FS={
  ok(){return location.protocol==='file:'&&!!window.showDirectoryPicker},
  guard(){if(this.ok())return true;Toast('File System API Required. Run Locally.',5000);return false}
};
/* packet codec — same on-disk format as the old storefront */
const Pkt={
  fn(title,id){const safe=(title||'item').replace(/[^a-zA-Z0-9_\-]/g,'_').slice(0,9).replace(/_+$/,'')||'item';return(id!=null?String(id)+'_':'')+safe+'.b64'},
  enc(p){const j=JSON.stringify(p);try{return btoa(unescape(encodeURIComponent(j)))}catch{return btoa(j)}},
  dec(s){try{let j;try{j=decodeURIComponent(escape(atob(s.trim())))}catch{j=atob(s.trim())}return JSON.parse(j)}catch{return null}}
};
/* file registry — known .b64 filenames on disk */
const Reg=(()=>{
  let known=new Set();
  return{add(fn){known.add(fn)},addAll(l){(l||[]).forEach(f=>known.add(f))},rm(fn){known.delete(fn)},list(){return[...known].sort()},clear(){known=new Set()}};
})();
/* ═══ STATIC LOADER — ported from storefront.txt (configs §21 data.static.*) ═══
   On a statically deployed website (http/https) the B64 working folder can NOT be
   linked (File System Access API requires file://), so the catalog is fetched
   READ-ONLY from the /src folder on the web server instead:
     1. <site>/src/latest.b64      — manifest: metadata-only items (no photos) + biz block
                                     + the list of packet filenames → Reg
     2. <site>/src/{id}_{title}.b64 — per-item packets, fetched ON DEMAND to hydrate
                                     photos (lazy: card thumbnails, detail view, editor)
   Item merge is newest-version-wins (same ver rules as DB.scan); ids the deployed
   manifest no longer contains are dropped, so redeploys fully refresh the catalog.
   Local file:// runs ignore this module entirely (FS + DB.scan remain the truth). */
const Static=(()=>{
  const MARK='bs_src_v1'; /* localStorage flag+ts: LS cache is a /src mirror (seed is not) */
  let ok=false,base='';
  const _ver=i=>Math.max(i&&i.updated||0,i&&i.created||0,i&&i.ended||0); /* same as DB.ver */
  const _log=m=>{try{console.log('[B64] '+new Date().toLocaleTimeString()+' '+m)}catch(e){}};
  function init(){ /* activate only on a real web host — file:// uses the DB folder */
    if(location.protocol.indexOf('http')===0){
      base=location.href.replace(/[?#].*/,'').replace(/\/[^/]*$/,'')+'/'+CFG.SRC;ok=true;
    }
  }
  function on(){return ok}
  async function loadAll(){ /* manifest import — runs once at boot, before first render */
    if(!ok)return false;
    let trusted=false;try{trusted=+localStorage.getItem(MARK)>0}catch(e){}
    const pre=ITEMS; /* remembered so a broken deploy can fall back to cache/seed */
    if(!trusted){ITEMS=[];_log('HTTP mode — loading from /'+CFG.SRC+'/ (ignoring local cache)')}
    else _log('HTTP mode — loading from /'+CFG.SRC+'/ (merging cached mirror)');
    try{
      const r=await fetch(base+'/latest.b64',{cache:'no-cache'});
      if(!r.ok)throw new Error('HTTP '+r.status);
      const d=Pkt.dec(await r.text());
      const man=d&&d.manifest?d.manifest:null;
      if(!man)throw new Error('latest.b64: no manifest block');
      if(Array.isArray(man.files))Reg.addAll(man.files);
      purgeSeed();window._b64Loaded=true; /* /src answered — placeholder listings go */
      const inMan=new Set();
      Object.values(man.items||{}).forEach(o=>{
        if(!o||o.id==null)return;inMan.add(+o.id);
        if(o.deleted||o.status==='deleted'){ITEMS=ITEMS.filter(x=>x.id!==+o.id);return} /* tombstone */
        const it=Object.assign({},o);delete it.deleted;
        const x=ITEMS.findIndex(z=>z.id===it.id);
        if(x===-1)ITEMS.push(it);
        else if(_ver(it)>_ver(ITEMS[x]))ITEMS[x]=it; /* manifest newer → metadata first, photos hydrate lazily */
        /* tie → keep the cached copy (it already carries hydrated photos) */
      });
      if(man.items&&Object.keys(man.items).length)ITEMS=ITEMS.filter(x=>inMan.has(+x.id)); /* deployed catalog is authoritative */
      if(Array.isArray(man.files))sessionStorage.setItem('db_files',JSON.stringify(Reg.list()));
      Biz.fromManifest(man); /* store name · PayPal · hours · password hash — header follows it live */
      try{localStorage.setItem(MARK,String(man.ts||Date.now()))}catch(e){}
      await saveItems(); /* mirror now matches /src (photos cached as they hydrate) */
      _log('Done: latest.b64 · '+ITEMS.length+' listings from /'+CFG.SRC+'/');
      if(Vnd.on())Toast('Loaded ✓ '+ITEMS.length+' listings from /'+CFG.SRC+'/',3200);
      return true;
    }catch(e){
      if(!ITEMS.length)ITEMS=pre; /* /src unreachable → fall back to cache or seed */
      _log('No latest.b64 in /'+CFG.SRC+'/ — '+(e&&e.message||e));
      if(Vnd.on())Toast('No /'+CFG.SRC+'/latest.b64 on the server — showing cached catalog',4600);
      return false;
    }
  }
  const _hyd=new Set(); /* ids whose packet was fetched this session (no refetch loops) */
  function need(id){ /* true = item exists but its photos still live only in /src */
    if(!ok)return false;const it=ITEMS.find(z=>z.id===+id);
    return!!it&&!(it.images&&it.images.length)&&!_hyd.has(+id);
  }
  async function fetchItem(id){ /* lazy photo hydration — one packet per listing, on demand */
    if(!ok)return false;
    const it=ITEMS.find(z=>z.id===+id);if(!it)return false;
    const fn=Pkt.fn(it.title,it.id);
    try{
      const r=await fetch(base+'/'+fn,{cache:'no-cache'});
      if(!r.ok)throw new Error('HTTP '+r.status);
      const d=Pkt.dec(await r.text());
      const w=d&&d.item&&d.item.id!=null?d.item:null;if(!w)return false;
      const x=ITEMS.findIndex(z=>z.id===w.id);
      if(x===-1)ITEMS.push(Object.assign({},w));
      else if(_ver(w)>=_ver(ITEMS[x]))ITEMS[x]=Object.assign({},w); /* packet is the full version — take its photos */
      _hyd.add(+id);await saveItems();
      return true;
    }catch(e){_log('fetch '+fn+': '+(e&&e.message||e));return false}
  }
  init();
  return{on,loadAll,fetchItem,need,base:()=>base};
})();
const DB=(()=>{
  let _dir=null,_savedName='';
  const log=m=>{try{console.log('[B64] '+new Date().toLocaleTimeString()+' '+m)}catch(e){}};
  const ver=i=>Math.max(i&&i.updated||0,i&&i.created||0,i&&i.ended||0);
  function foot(){ /* B64 button state (configs §12 db.glow gn/rd) + status-bar truth */
    try{liveBadge()}catch(e){}
    const b=$('b64btn');
    if(b){b.classList.toggle('gn',!!_dir);b.classList.toggle('rd',!_dir);
      b.title=_dir?'B64 folder linked: '+_dir.name+' (click to relink)'
        :(Static.on()?'Web mode — catalog loads read-only from /'+CFG.SRC+'/ (B64 folder linking is local-only)'
        :(_savedName?'Reconnect '+_savedName+' — relinks on click':'Link B64 folder (required to add/edit listings)'))}
    const f=$('ft-b64');
    if(f&&Vnd.on())f.innerHTML=_dir?'<b>B64</b> linked: '+E(_dir.name)
      :(Static.on()?'<b>B64</b> web — reading /'+E(CFG.SRC)+'/'
      :(_savedName?'<b>B64</b> remembered: '+E(_savedName):'<b>B64</b> not linked — local storage'));
  }
  /* ── persistent folder link: handle remembered in IndexedDB 'storefront-b64' ── */
  function _idb(){return new Promise((res,rej)=>{const r=indexedDB.open('storefront-b64',1);r.onupgradeneeded=()=>r.result.createObjectStore('h');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
  async function _hGet(){try{const d=await _idb();return await new Promise((res,rej)=>{const q=d.transaction('h').objectStore('h').get('dir');q.onsuccess=()=>res(q.result||null);q.onerror=()=>rej(q.error)})}catch{return null}}
  async function _hSet(h){try{const d=await _idb();await new Promise((res,rej)=>{const t=d.transaction('h','readwrite');if(h)t.objectStore('h').put(h,'dir');else t.objectStore('h').delete('dir');t.oncomplete=res;t.onerror=()=>rej(t.error)})}catch(e){log('Could not remember folder: '+e.message)}}
  /* silent=true: only re-link if permission is still granted (no prompt, works without a click) */
  async function restore(silent){
    if(_dir)return true;
    if(!FS.ok())return false;
    const h=await _hGet();if(!h){_savedName='';foot();return false}
    _savedName=h.name||'';
    try{
      let p=await h.queryPermission({mode:'readwrite'});
      if(p!=='granted'){if(silent){foot();return false}p=await h.requestPermission({mode:'readwrite'})}
      if(p!=='granted'){foot();return false}
      _dir=h;log('Re-linked folder: '+h.name);Toast('Linking '+h.name+'…');await scan();foot();return true;
    }catch(e){_dir=null;log('Re-link failed: '+e.message);foot();return false}
  }
  /* true only if a folder is linked AND we may write to it right now */
  async function ready(){
    if(!_dir)return false;
    try{let p=await _dir.queryPermission({mode:'readwrite'});if(p!=='granted')p=await _dir.requestPermission({mode:'readwrite'});return p==='granted'}catch{return false}
  }
  /* gate for New / Edit / Sold / End / Delete. Not on disk (http) → localStorage mode stays open. */
  async function ensure(){

  async function pick(){
    try{
      if(!FS.guard())return;

      _dir=await window.showDirectoryPicker({mode:'readwrite'});_savedName=_dir.name;await _hSet(_dir);log('Folder: '+_dir.name);Toast('Scanning…');await scan();foot();
    }catch(e){if(e.name!=='AbortError'){log('Open failed: '+e.message);Toast('Error: '+e.message)}}
  }
  const _closeDetail=()=>{try{if($('view-detail').classList.contains('on'))Det._closeView()}catch(e){}};
  async function scan(){ /* read every packet — newest version wins per id, ended/deleted honored */
    if(!_dir){log('No folder open');return}
    const files=[];for await(const[n,h]of _dir.entries())if(h.kind==='file'&&n.endsWith('.b64')&&n!=='latest.b64'&&n!=='packages.b64')files.push({n,h});
    if(!files.length){log('No .b64 files');Toast('Folder empty — disk is source of truth');ITEMS=[];window._b64Loaded=true;await saveItems();_closeDetail();chrome();Browse.reset();foot();return}
    const CONC=16;let done=0;
    const map=new Map(),del=new Set();
    async function _one({n,h}){
      try{
        const t=await(await h.getFile()).text();const d=Pkt.dec(t);if(!d)return;
        if(d.status==='deleted'&&d.id!=null)del.add(+d.id);
        else if(d.item&&d.item.id!=null){
          const it=Object.assign({},d.item);
          if(d.status==='ended'&&it.status!=='ended'){it.status='ended';it.ended=it.ended||d.ts||Date.now();it.updated=Math.max(it.updated||0,d.ts||0)}
          const cur=map.get(it.id);
          if(!cur||ver(it)>ver(cur)||(ver(it)===ver(cur)&&it.status==='ended'&&cur.status!=='ended'))map.set(it.id,it);

    try{const fh=await _dir.getFileHandle('latest.b64');const d=Pkt.dec(await(await fh.getFile()).text());if(d&&d.manifest)Biz.fromManifest(d.manifest)}catch(e){}
    log('Done: '+files.length+' files · '+ITEMS.length+' listings');

  function _hasDir(){return!!_dir}
  /* every write is verified by reading the file back; stale files from renamed titles are removed */
  async function _dropStale(id,keep){

  /* next free id = highest id in memory AND on the folder (other workstations may have added listings) */
  async function freshId(){

    return mx+1;
  }
  /* is there a newer version of this listing on disk than the one we loaded? (returns it, or {deleted:true}, or null) */

        if(d.status==='deleted'){if((d.ts||0)>bv){best={deleted:true,ts:d.ts||0};bv=d.ts||0}continue}
        const it=d.item;if(it&&ver(it)>bv){best=it;bv=ver(best)}

    try{chrome();Browse.render()}catch(e){}
    Toast('⚠ This listing was changed on another workstation — your change was NOT saved. Cancel, reopen it and redo the change.',7000);
    log('CONFLICT on #'+id+': a newer version is on disk — write blocked');
  }
  async function write(item,status){
    if(!FS.ok())return null;
    if(!item||!item.title)return null;
    if(!_dir||!await ready()){Toast('B64 folder not linked — link it first');log('Write blocked: folder not linked');return null}
    const fn=Pkt.fn(item.title,item.id);const had=Reg.list().includes(fn);Reg.add(fn);
    const ts=Date.now();
    const payload={v:9,ts,store:CFG.NAME,status:status||'active',id:item.id||null,item:item||null,files:Reg.list()};
    const encoded=Pkt.enc(payload);const kb=Math.round(encoded.length/1024);
    if(kb>8192)log('WARN: '+fn+' is '+kb+'KB');
    try{
      const fh=await _dir.getFileHandle(fn,{create:true});const w=await fh.createWritable();await w.write(encoded);await w.close();
      const back=Pkt.dec(await(await fh.getFile()).text());
      if(!back||back.ts!==ts||(back.id||null)!==(item.id||null))throw new Error('read-back check failed');
      log('Written: '+fn+' ('+kb+'KB) — verified');
    }catch(e){if(!had)Reg.rm(fn);log('Write err: '+e.message);Toast('Write failed: '+e.message);return null}
    if(item.id!=null)await _dropStale(item.id,fn);
    return fn;
  }
  /* ── latest.b64: manifest built from memory, merged with whatever other workstations wrote ── */
  const _mf=i=>{const o=Object.assign({},i);delete o.images;delete o.thumbs;return o};
  async function manifestObj(){
    const mem={};ITEMS.forEach(i=>{mem[i.id]=_mf(i)});
    const names=[];
    if(_dir){try{for await(const[n,h]of _dir.entries())if(h.kind==='file'&&n.endsWith('.b64')&&n!=='latest.b64'&&n!=='packages.b64')names.push(n)}catch(e){}}
    names.sort();names.forEach(n=>Reg.add(n));
    return{manifest:{v:9,ts:Date.now(),store:CFG.NAME,paypal:CFG.PP_EMAIL||'',biz:Biz.manifestData(),files:names.length?names:Reg.list(),items:mem}};
  }
  async function _writeManifest(){
    const obj=await manifestObj();const encoded=Pkt.enc(obj);
    const fh=await _dir.getFileHandle('latest.b64',{create:true});const w=await fh.createWritable();await w.write(encoded);await w.close();
    return Math.round(encoded.length/1024);
  }
  /* on-demand manifest write (Business Info save) — returns KB written, 0 when not possible */
  async function genManifest(){
    if(!_dir||!FS.ok())return 0;
    if(!await ready()){Toast('B64 folder not linked — link it first');return 0}
    try{return await _writeManifest()}catch(e){log('Manifest err: '+e.message);Toast('Manifest write failed: '+e.message);return 0}
  }
  /* silently rewrite latest.b64 whenever a change is made (no toast, just log) */
  async function autoSave(){
    if(!_dir||!FS.ok())return;
    try{const kb=await _writeManifest();log('latest.b64 autosaved ('+kb+'KB)')}catch(e){log('autoSave err: '+e.message)}
  }
  return{restore,ready,ensure,pick,scan,write,freshId,conflict,conflictMsg,autoSave,genManifest,dir:()=>_dir,_hasDir,ver,foot,stats:()=>{try{chrome()}catch(e){}}};
})();
/* ── REFRESH GUARD — configs §20 modal.refreshguard: reload wipes the folder link, so ask for the PIN ── */
const RefreshGuard={
  _on:false,
  arm(){this._on=true},
  disarm(){this._on=false},
  sync(){this._on=!!(Vnd.on()&&DB._hasDir())},
  async confirm(){
    if(!await Vnd.checkPw($('rgpin').value)){Toast('Wrong PIN');$('rgpin').value='';$('rgpin').focus();return}
    this._on=false;$('rgmod').classList.remove('onm');location.reload();
  },
  cancel(){$('rgmod').classList.remove('onm');$('rgpin').value=''}
};
document.addEventListener('keydown',e=>{
  if(!RefreshGuard._on)return;
  if((e.ctrlKey&&e.key==='r')||(e.ctrlKey&&e.key==='R')||e.key==='F5'){
    e.preventDefault();$('rgmod').classList.add('onm');setTimeout(()=>{if($('rgmod').classList.contains('onm'))$('rgpin').focus()},40);
  }
});
window.addEventListener('beforeunload',e=>{
  if(!RefreshGuard._on)return;
  const m='DATABASE will be DISCONNECTED if page is refreshed!';
  e.preventDefault();e.returnValue=m;return m;
});

/* ═══ GLOBAL KEYS + OUTSIDE CLICK (beh.keys.esc — close menu → modals → detail) ═══ */
document.addEventListener('click',e=>{if(!e.target.closest('.sqwrap'))SortMenu.close()});
document.addEventListener('keydown',e=>{
  if(e.key!=='Escape')return;
  if($('sortpop').classList.contains('on')){SortMenu.close();return}
  if(Basket.isOpen()){Basket.close();return}
  for(const m of['emod','vmod','bimod','rgmod'])if($(m).classList.contains('onm')){$(m).classList.remove('onm');return}
  if($('view-detail').classList.contains('on'))Det.close();
});
window.addEventListener('popstate',e=>{
  if(Basket.popGuard())return; /* Back while the basket is open → close the basket only */
  const id=e.state&&e.state.det;
  if(id&&get(id)){Det.open(id,false);return} /* back/forward onto a listing — show it, no new entry */
  if($('view-detail').classList.contains('on'))Det._closeView();
  Browse.restoreScroll(); /* land on the exact search + scroll remembered for the browse view */
});

/* ═══ INIT ═══ */
(async function init(){
  Biz.apply(); /* paints header title · back-button label · OG/JSON-LD from business info */
  SortMenu.sync();
  Vnd.apply();
  Browse.init();
  /* catalog load — IndexedDB first (photos fit), legacy localStorage migrated once, seed last */
  ITEMS=await Store.loadItems();
  /* STATIC DEPLOY (configs §21 data.static.*): on http(s) the catalog is fetched from the
     /src folder BEFORE the first render — manifest metadata now, photos lazily per item.
     file:// runs skip this and keep using the linked B64 folder (DB.scan). */
  if(Static.on())await Static.loadAll();
  if(FS.ok()){try{await DB.restore(true)}catch(e){}} /* folder still permitted → real data replaces placeholders before first paint */
  /* browse-state memory — search · sort · cards loaded · scroll (empty searches included);
     a ?item= deeplink opens ON TOP of the restored browse view instead of replacing it */
  const deep=(()=>{try{return +new URLSearchParams(location.search).get('item')||0}catch(e){return 0}})();
  if(!Browse.restoreSaved())Browse.render();
  Basket.render();
  $('f-img').addEventListener('change',e=>Ed.pick(e.target.files&&e.target.files[0]));
  /* silent B64 relink at startup — only if the browser still holds the permission (no prompt);
     otherwise the B64 button stays red and relinks on click (storefront.txt init: DB.restore(true)) */
  RefreshGuard.sync();liveBadge();
  try{
    if(deep&&get(deep)){history.replaceState({det:deep},'','?item='+deep);Det.open(deep,false)}
    else history.replaceState({browse:1},'',''+location.pathname);
  }catch(e){}
})();
</script>
